<!--
  Claude+ — Grand Line, the game window.

  A from-scratch Game Boy-style RPG. Nothing here is emulated and no ROM is
  involved: 160x144 logical pixels, the 4-colour DMG palette, 8x8 tiles
  composed into 16x16 blocks, exactly the way the real hardware laid out a
  tilemap. Everything on screen is drawn by this file.

  The one rule that matters for correctness: this file owns the WORLD (maps,
  tiles, creatures, battle maths) and owns NONE of the NUMBERS. Every level,
  bounty and island gate comes from state/game_data.js, which generate.py
  writes from the real roster and the real award log. Same anti-drift rule the
  dashboard's level curve has — a second copy of a level in here would be the
  same bug class, so there isn't one. No data island -> the crew simply isn't
  home, and the game says so instead of inventing anyone's level.

  ---- TWO LEDGERS, ONE DIRECTION OF FLOW ------------------------------------

  Decided 2026-08-05, explicitly, because it is the thing that would quietly
  ruin both halves if it ever blurred:

    REAL XP (work)                      | VOYAGE PROGRESS (play)
    ------------------------------------|------------------------------------
    crew/award_log.jsonl -> roster.md   | localStorage, this file only
    earned by real finished work        | earned by playing
    drives levels, bounties, poster     | drives battles won, the bestiary,
      reveals, island gates, and which  |   the voyage log — and nothing else
      domains get a real agent file     |
    written ONLY by generate.py         | never touches roster.md or the
      --award, on his confirmation      |   award log, by construction
    this game: READ-ONLY                | this game: read-write

  So: winning a battle awards nothing. Grinding tall grass forever moves no
  level, no bounty and no island gate. The only way a number in the crew half
  moves is real work, confirmed by him, through the crew-xp skill. Play is
  recreational and stays recreational.

  Enforced structurally, not just by intention: play state lives in
  localStorage, so this page has no filesystem write path to the real ledger at
  all, and no Swift bridge is wired for one. tests/smoke_checks.py asserts this
  file never references roster.md, award_log.jsonl or --award, so a later
  session can't quietly connect them.
-->

function commas(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
// \x02 is the berry glyph in FONT below.
function berry(n) { return "\x02" + commas(n); }

// ---------------------------------------------------------------- play state

// The recreational ledger — the other half of the two-ledger rule at the top of
// this file. Everything in here is earned by playing and means nothing to the
// real roster. It lives in localStorage precisely because that gives the page
// no way to reach the real award log even by accident.
const SAVE_KEY = "claudeplus.grandline.v1";
// The manual save slot, deliberately separate from the rolling autosave above.
// The autosave is just the console still being on; the slot is the classic
// "save in front of the legendary, reset and retry when the cage breaks" file.
const SLOT_KEY = "claudeplus.grandline.slot1";
const play = {
  battlesWon: 0,
  battlesLost: 0,
  escapes: 0,
  steps: 0,
  seen: {},      // species id -> times encountered
  beaten: {},    // species id -> times defeated
  caught: {},    // species id -> times caught
  trainers: {},  // trainer id -> true once beaten, so they stay beaten
  badges: {},    // badge id -> true, earned from gym leaders
  box: [],       // caught beasts beyond the party of 6
  party: [],     // the fighters, persisted; see ensureParty()
  cages: 5,      // legacy field, migrated into items.cage by ensureParty()
  items: null,   // { cage: n, meat: n, ... } — see ITEMS
  belly: 500,    // money. Prize money from trainers only, like the originals.
  pos: null,     // {map, x, y, dir} — where you were when you last stepped
  mute: false,   // sound off, persisted like the rest of the play ledger
  visited: {},   // map id -> true once you have stood there
  quests: {},    // quest id -> "started" | "ready" | "done"
  goalSeen: null, // last main-goal id shown, so it announces once per change
};

function loadPlay() {
  // file:// pages can be denied storage depending on the host webview, and a
  // blocked read must cost the save file, not the game — hence try/catch and an
  // in-memory fallback rather than a hard dependency.
  try {
    const raw = window.localStorage && localStorage.getItem(SAVE_KEY);
    if (raw) Object.assign(play, JSON.parse(raw));
    play.storage = true;
  } catch (e) {
    play.storage = false;
  }
}

function savePlay() {
  if (play.storage === false) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(play));
  } catch (e) {
    play.storage = false;
  }
}

function speciesCount(map) { return Object.keys(map || {}).length; }

// ---- the manual save slot ---------------------------------------------------
function writeSlot() {
  if (play.storage === false) return false;
  try {
    // The autosave only records position on a map CHANGE; a manual save must
    // pin the exact tile, or loading would teleport you to the map's entrance.
    play.pos = { map: game.mapId, x: game.player.x, y: game.player.y, dir: game.player.dir };
    savePlay();
    localStorage.setItem(SLOT_KEY, JSON.stringify(play));
    return true;
  } catch (e) { return false; }
}

function readSlot() {
  try {
    const raw = window.localStorage && localStorage.getItem(SLOT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function loadSlot() {
  const snap = readSlot();
  if (!snap) return false;
  // Replace, don't merge: a key the snapshot lacks must not survive from the
  // abandoned run (that's the whole point of loading).
  for (const k of Object.keys(play)) delete play[k];
  Object.assign(play, snap);
  play.storage = true;
  ensureParty();
  const pos = play.pos && MAPS[play.pos.map]
    ? play.pos : { map: "sunny", x: 4, y: 5, dir: "down" };
  loadMap(pos.map, pos.x, pos.y, pos.dir || "down");
  game.fadeFrames = 0;
  savePlay();
  return true;
}

// ---------------------------------------------------------------- blocks

// Procedural texture where a pattern beats hand-drawing (grass speckle, brick
// courses, planks); authored art where the shape carries meaning (tree, sign).
const PATTERNS = {
  // Ground texture, shared by the grass palette and the desert one. The first
  // version lit 1 pixel in 23 and read as a flat sheet with dust on it. This
  // mixes two tones at ~17% coverage, which is enough to look like a surface.
  //
  // The constraint that shapes it: every 16x16 ground block is IDENTICAL, so
  // any strong or regular motif tiles into a visible lattice across the whole
  // screen. Hence low contrast, and a hash (`x*y`) that breaks the diagonal
  // banding a plain `ax+by` term produces.
  grass: (x, y) => {
    // XOR hash, not `ax + by`: any linear term makes the lit pixels fall on
    // parallel diagonals, and at 3x zoom that reads as corduroy stripes running
    // across the whole map. Looked at it, saw the stripes, replaced it.
    const h = (((x * 73856093) ^ (y * 19349663)) >>> 0) % 29;
    if (h === 0) return MID;
    if (h < 5) return LITE;
    return PAPER;
  },
  tallgrass: (x, y) => {
    const c = x % 8, r = y % 8;
    if (r === 0) return PAPER;                                  // gap between tuft rows
    if (r === 1) return (c === 1 || c === 4 || c === 6) ? MID : PAPER;  // ragged tips
    if (r <= 5) {
      if (c === 0 || c === 7) return PAPER;                     // tuft edges
      if ((c === 2 || c === 5) && (r === 3 || r === 4)) return DARK;  // blade cuts
      return MID;
    }
    return LITE;                                                // lit base row
  },
  // A 50% dither, not a speckle. The two light greens in the DMG palette are
  // genuinely close together, so "mostly LITE" next to "mostly PAPER" was almost
  // invisible on screen — the town path and the grass looked like one surface.
  // A fine checkerboard reads as a different material at any zoom.
  // Was a hard 50% checker. That was the right call when the DMG palette's two
  // light greens were nearly identical and a path could vanish into grass — but
  // that reasoning predates real colour palettes, and at 3x zoom a 50% dither
  // reads as loud crosshatch across every street in the game. Sand and grass
  // are now different HUES, so the path no longer needs a pattern to be told
  // apart; it needs one that says "trodden dirt". Same XOR hash as the ground.
  path: (x, y) => {
    const h = (((x * 83492791) ^ (y * 29572891)) >>> 0) % 21;
    if (h === 0) return MID;
    if (h < 5) return LITE;
    return PAPER;
  },
  water: (x, y, f) => {
    const wob = Math.sin((x + f * 2) / 3.2) * 1.6;
    const band = (y + Math.round(wob)) % 8;
    if (band === 0) return PAPER;
    if (band === 4) return LITE;
    // Sparse glints, drifting with the frame, so the water BETWEEN the crests
    // is not a flat slab. `y + f` rather than `y` alone means they move, which
    // is what stops a still frame reading as a striped floor.
    if ((((x * 4391) ^ ((y + f) * 7919)) >>> 0) % 37 === 0) return LITE;
    return MID;
  },
  wall: (x, y) => {
    if (y % 5 === 0) return DARK;                       // mortar course
    const row = Math.floor(y / 5);
    if ((x + (row % 2) * 4) % 8 === 0) return DARK;     // staggered joints
    return (y % 5 === 1) ? LITE : MID;                  // top-lit brick
  },
  roofL: (x, y) => ((x + y) % 5 === 0 ? DARK : ((x + y) % 5 === 1 ? PAPER : LITE)),
  roofR: (x, y) => ((x - y + 32) % 5 === 0 ? DARK : ((x - y + 32) % 5 === 1 ? PAPER : LITE)),
  // Kept deliberately quiet. The first version used dark seams plus butt joints
  // and the deck read as brickwork on screen — measured by looking at it, not by
  // reasoning about it. A light deck with one faint seam is what says "wood".
  // Long unbroken seams in one direction only. The butt joints this used to have
  // crossed the seams and the whole deck read as brick courses on screen — the
  // thing that says "planks" is the absence of the cross-lines.
  deck: (x, y) => (y % 8 === 7 ? LITE : PAPER),
  // One block for the whole bulwark, on all four sides: a symmetric ring, so a
  // corner needs no special case and there is no top/bottom/left/right variant
  // to keep in sync.
  rail: (x, y) => {
    const edge = Math.min(x, y, 15 - x, 15 - y);
    if (edge === 0) return DARK;
    if (edge <= 2) return LITE;
    return MID;
  },
  // Interior flagstones and a runner carpet, for gyms.
  floor: (x, y) => {
    if (x % 8 === 0 || y % 8 === 0) return MID;
    return (x % 16 < 8) === (y % 16 < 8) ? PAPER : LITE;
  },
  carpet: (x, y) => {
    if (y % 16 === 0 || y % 16 === 15) return DARK;
    return (x + y) % 6 === 0 ? MID : LITE;
  },
  cabin: (x, y) => {
    const edge = Math.min(x, y, 15 - x, 15 - y);
    if (edge === 0) return DARK;
    if (y % 6 === 2) return MID;
    return LITE;
  },
};

// id -> { frames:[canvas], solid, encounter }
const BLOCKS = {};

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  return c;
}

function paintCanvas(size, fn, frame, pal) {
  const P = pal || PALETTES.dmg;
  const c = makeCanvas(size, size);
  const g = c.getContext("2d");
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const idx = fn(x, y, frame);
      if (idx === null || idx === undefined) continue;
      g.fillStyle = P[idx];
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

function paintArt(rows, size, bgFn, frame, pal, bgPal) {
  const P = pal || PALETTES.dmg;
  const BP = bgPal || P;
  const c = makeCanvas(size, size);
  const g = c.getContext("2d");
  if (bgFn) {
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        g.fillStyle = BP[bgFn(x, y, frame)];
        g.fillRect(x, y, 1, 1);
      }
    }
  }
  for (let y = 0; y < rows.length && y < size; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length && x < size; x++) {
      const ch = row[x];
      if (ch === "." || ch === " ") continue;
      g.fillStyle = P[+ch];
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

function defBlock(id, opts) {
  const frames = [];
  const n = opts.frames || 1;
  const pal = PALETTES[opts.pal] || PALETTES.dmg;
  // Art blocks can sit on a background painted from a DIFFERENT palette — a
  // tree is tree-green over grass-green, not one palette stretched over both.
  const bgPal = PALETTES[opts.bgPal] || pal;
  for (let f = 0; f < n; f++) {
    frames.push(opts.art
      ? paintArt(opts.art, BLK, opts.bg ? PATTERNS[opts.bg] : null, f, pal, bgPal)
      : paintCanvas(BLK, PATTERNS[opts.pattern], f, pal));
  }
  BLOCKS[id] = {
    frames,
    solid: !!opts.solid,
    encounter: !!opts.encounter,
    animated: n > 1,
  };
}

// ---- big battle sprites ----------------------------------------------------
//
// The 16x16 overworld art is hand-authored as strings because at that size the
// strings ARE readable pixel art. At 48x48 they are not: 48 rows of 48
// characters is where miscounted lines and lopsided silhouettes come from, and
// I already shipped one lopsided sprite that way (the old back sprite read as a
// cauldron). These are composed from shaded primitives instead — geometry the
// code guarantees, proportions I tune by looking at a render.
function ellipseHit(x, y, cx, cy, rx, ry) {
  const dx = (x - cx) / rx, dy = (y - cy) / ry;
  return dx * dx + dy * dy <= 1;
}

// Each part paints a filled shape with a 1px dark outline and a lighter
// top-left highlight, which is what makes a flat blob read as volume.
// Non-square variant for the HGSS-style 16x24 character frames — the head
// overhangs the tile, so the canvas is taller than a block.
function paintArtWH(rows, w, h, pal) {
  const P = pal || PALETTES.dmg;
  const c = makeCanvas(w, h);
  const g = c.getContext("2d");
  for (let y = 0; y < rows.length && y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length && x < w; x++) {
      const ch = row[x];
      if (ch === "." || ch === " ") continue;
      g.fillStyle = P[+ch];
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

function paintParts(size, parts, pal) {
  const P = pal || PALETTES.dmg;
  const c = makeCanvas(size, size);
  const g = c.getContext("2d");
  for (const p of parts) {
    const inside = (x, y) => p.kind === "rect"
      ? (x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h)
      : ellipseHit(x, y, p.cx, p.cy, p.rx, p.ry);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (!inside(x, y)) continue;
        // Outline: an inside pixel with at least one outside neighbour.
        const edge = !inside(x - 1, y) || !inside(x + 1, y) ||
                     !inside(x, y - 1) || !inside(x, y + 1);
        let col = p.fill;
        if (edge && p.outline !== false) col = DARK;
        else if (p.shade !== undefined) {
          // Highlight the upper-left third of the shape.
          const hx = p.kind === "rect" ? p.x + p.w / 3 : p.cx - p.rx / 3;
          const hy = p.kind === "rect" ? p.y + p.h / 3 : p.cy - p.ry / 3;
          if (x < hx && y < hy) col = p.shade;
        }
        g.fillStyle = P[col];
        g.fillRect(x, y, 1, 1);
      }
    }
  }
  return c;
}

const SPRITES = {};
function buildSprites() {
  for (const key in BIG_SPRITES) {
    SPRITES[key] = paintParts(BIG, BIG_SPRITES[key], PALETTES[BIG_PALS[key] || "beast"]);
  }
  // Head block (9 rows) + shared body (15 rows) = one 16x24 crew sprite —
  // the HGSS proportion, same as the player.
  for (const key in NPC_HEADS) {
    SPRITES["npc_" + key] = paintArtWH(NPC_HEADS[key].concat(NPC_BODY), BLK, 24,
                                       PALETTES[CREW_PALS[key] || "crew_default"]);
  }
  // The player is the HGSS pilot: 16 wide, 24 tall, head overhanging the tile.
  for (const key of ["luffy_down_0", "luffy_down_1", "luffy_up_0", "luffy_up_1",
                     "luffy_side_0", "luffy_side_1"]) {
    SPRITES[key] = paintArtWH(ART[key], BLK, 24, PALETTES.luffy);
  }
  SPRITES.npc = paintArtWH(ART.npc, BLK, 24, PALETTES.crew_default);
  SPRITES.marine = paintArtWH(ART.marine, BLK, 24, PALETTES.marine);
  SPRITES.coast_lord = paintArt(ART.coast_lord, BLK, null, 0, PALETTES.water);
  SPRITES.sandora_lord = paintArt(ART.sandora_lord, BLK, null, 0, PALETTES.catfish);
  SPRITES.garp = paintArt(ART.garp, BLK, null, 0, PALETTES.marine);
  // The old 24x24 battle art is superseded by the 48x48 composed sprites but is
  // still referenced by the sprite sheet, so it keeps a palette.
  for (const key of ["back_luffy", "sea_king", "marine_grunt", "den_den"]) {
    SPRITES[key] = paintArt(ART[key], 24, null, 0, PALETTES.beast);
  }
  // Left-facing is the right-facing sprite mirrored — the same trick the real
  // games used to halve their sprite budget.
  for (const f of [0, 1]) {
    const src = SPRITES["luffy_side_" + f];
    const c = makeCanvas(src.width, src.height);
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.translate(src.width, 0);
    g.scale(-1, 1);
    g.drawImage(src, 0, 0);
    SPRITES["luffy_left_" + f] = c;
  }
}

// ---------------------------------------------------------------- items

// Bag items and the shop's stock. `kind` drives what using one does:
//   ball -> a catch attempt      heal -> restore HP to the active fighter
//   cure -> clears any status ailment
const ITEMS = {
  cage:     { name: "SEA CAGE", price: 200, kind: "ball" },
  meat:     { name: "MEAT", price: 150, kind: "heal", amount: 20 },
  big_meat: { name: "BIG MEAT", price: 400, kind: "heal", amount: 60 },
  // Key item: never sold, never spent, it opens the way. The Log Pose is the
  // canon Grand Line gate — maps are useless there, only the Pose reads it.
  log_pose: { name: "LOG POSE", price: 0, kind: "key" },
  herb:     { name: "RUMBLE HERB", price: 250, kind: "cure" },
  // Garp's rice crackers. The best heal in the game and the ONLY item not sold
  // anywhere — the whole reward for beating him, so it must stay off the shelf.
  senbei:   { name: "RICE CRACKER", price: 500, kind: "heal", amount: 100 },
};
const SHOP_STOCK = ["cage", "meat", "big_meat", "herb"];
// Everything sells back at half its shop price, like the originals.
function sellPrice(id) { return Math.floor(ITEMS[id].price / 2); }

function itemCount(id) { return (play.items && play.items[id]) || 0; }
function bagIds() { return Object.keys(ITEMS).filter(id => itemCount(id) > 0); }
function giveItem(id, n) {
  play.items[id] = itemCount(id) + (n === undefined ? 1 : n);
  savePlay();
}
function takeItem(id) {
  if (itemCount(id) <= 0) return false;
  play.items[id] -= 1;
  savePlay();
  return true;
}
function berryShort(n) { return "\x02" + commas(n); }

// ---------------------------------------------------------------- quests
//
// Side quests, his ask ("misiones secundarias, lo mismo que Pokémon"). The
// engine is three NPC fields and one state string per quest in the play save:
//   questGive    on the giver — starts it, repeats a reminder while open
//   questAdvance on the middle NPC — flips "started" -> "ready"
//   (the giver again) — sees "ready", pays the reward, marks "done"
// All recreational, all in localStorage, like everything else play-earned.
const QUESTS = {
  lost_husband: {
    give: ["MY HUSBAND SAILED OFF TO BE A COOK", "ON SOME FLOATING RESTAURANT.",
           "TELL HIM HIS DINNER'S GONE COLD."],
    remind: ["THE RESTAURANT FLOATS, THEY SAY.", "SOMEWHERE PAST SYRUP VILLAGE."],
    advance: ["THE OLD COOK FROM SHELLS TOWN?", "HA! HE SCRUBS OUR POTS.",
              "TELL HER HE'LL WRITE. HE WON'T."],
    done: ["HE'S ALIVE? AND COOKING?!", "THAT MAN NEVER BOILED AN EGG.",
           "HERE - FOR YOUR TROUBLE."],
    reward: { item: "big_meat", n: 2 },
  },
};

function questReward(q) {
  if (q.reward && ITEMS[q.reward.item]) {
    giveItem(q.reward.item, q.reward.n || 1);
    return ["GOT " + (q.reward.n || 1) + "x " + ITEMS[q.reward.item].name + "!"];
  }
  return [];
}

// ---- the GAME's own progression -------------------------------------------
//
// This curve belongs to the game and has nothing to do with the crew's level
// curve in generate.py. That separation is the point (see the two-ledger rule at
// the top of this file): a beast levelling up here is play, and it moves no
// bounty, no gate and no agent file. Medium-fast, the classic n^3 shape, so the
// early game moves quickly.
function xpToReach(level) { return Math.floor(4 * Math.pow(level, 3) / 5); }

function levelFromXp(xp) {
  let lvl = 1;
  while (lvl < 100 && xp >= xpToReach(lvl + 1)) lvl++;
  return lvl;
}

function xpYieldFor(foe) {
  const sp = speciesOf(foe);
  return Math.max(1, Math.floor((sp.xpYield || 30) * foe.lvl / 7));
}

// ---- fighters --------------------------------------------------------------
//
// The persisted shape is deliberately tiny — {id, lvl, xp, hp, moves:[{id,pp}]}
// — and every other number is derived on read. Same derive-never-store rule the
// roster uses, and for the same reason: a stored maxHp is a number that can go
// stale against the thing that computes it.
function speciesOf(f) { return SPECIES[f.id] || SPECIES.den_den; }
function statFor(base, level) { return Math.floor(base * 2 * level / 100) + 5; }
function hpFor(base, level) { return Math.floor(base * 2 * level / 100) + level + 10; }
function maxHpOf(f) { return hpFor(speciesOf(f).base.hp, f.lvl); }
function atkOf(f) { return statFor(speciesOf(f).base.atk, f.lvl); }
function defOf(f) { return statFor(speciesOf(f).base.def, f.lvl); }
function nameOf(f) { return f.nick || speciesOf(f).name; }
function typeOf(f) { return speciesOf(f).type; }
function frontSpriteOf(f) { return speciesOf(f).sprite; }
// Back sprites: only the starter has a dedicated one so far, so a caught beast
// borrows its front art. Reads acceptably on the blobby species and wrong on the
// humanoid one — real back sprites are the graphics pass, not a hidden bug.
function backSpriteOf(f) { return speciesOf(f).back || speciesOf(f).sprite; }
function movesOf(f) {
  return f.moves.map(m => ({ ...MOVES[m.id], id: m.id, ppLeft: m.pp }));
}
function isFainted(f) { return f.hp <= 0; }

function movesAtLevel(speciesId, level) {
  return (SPECIES[speciesId].learnset || [])
    .filter(([lv]) => lv <= level)
    .map(([, id]) => id)
    .slice(-MOVE_MAX);
}

function makeFighter(speciesId, level, nick) {
  const f = {
    id: speciesId,
    lvl: level,
    xp: xpToReach(level),
    hp: 0,
    nick: nick || null,
    // status: one Gen 1 ailment or null; slp counts the sleep turns left.
    // Older saves lack both fields — undefined reads as "no ailment", so they
    // load fine without a migration.
    status: null,
    slp: 0,
    moves: movesAtLevel(speciesId, level).map(id => ({ id, pp: MOVES[id].pp })),
  };
  f.hp = maxHpOf(f);
  return f;
}

function healFighter(f) {
  f.hp = maxHpOf(f);
  f.status = null;
  f.slp = 0;
  f.moves.forEach(m => { m.pp = MOVES[m.id].pp; });
}

// ---- status ailments (Gen 1 rules, simplified) ------------------------------
// PSN chips 1/8 max HP after the sufferer acts; BRN chips 1/16 and halves
// attack; PAR loses the turn 25% of the time; SLP loses 1-3 turns outright.
// One ailment at a time. Fainting or any full heal clears it.
const STATUS_LABEL = { PSN: "POISONED", BRN: "BURNED", PAR: "PARALYZED", SLP: "ASLEEP" };

function applyStatus(f, status) {
  if (!STATUS_LABEL[status] || f.status) return false;
  f.status = status;
  f.slp = status === "SLP" ? 1 + Math.floor(Math.random() * 3) : 0;
  return true;
}

function battleAtkOf(f) {
  const a = atkOf(f);
  return f.status === "BRN" ? Math.max(1, Math.floor(a / 2)) : a;
}

// End-of-action chip damage for PSN/BRN. Mutates the fighter; returns the lines.
function statusChip(f, label) {
  if (f.status !== "PSN" && f.status !== "BRN") return [];
  const amt = Math.max(1, Math.floor(maxHpOf(f) / (f.status === "PSN" ? 8 : 16)));
  f.hp = Math.max(0, f.hp - amt);
  return [label + " IS HURT BY " + (f.status === "PSN" ? "POISON!" : "ITS BURN!")];
}

// Returns the lines to show; mutates the fighter. Level-ups recompute stats by
// construction (they are derived), so the only thing to carry over by hand is
// the HP gained from a bigger maximum.
function grantXp(f, amount) {
  const lines = [nameOf(f) + " GAINED " + amount + " XP!"];
  const before = f.lvl;
  const beforeMax = maxHpOf(f);
  f.xp += amount;
  f.lvl = Math.max(f.lvl, levelFromXp(f.xp));
  if (f.lvl > before) {
    f.hp += maxHpOf(f) - beforeMax;
    SFX.level();
    lines.push(nameOf(f) + " GREW TO LEVEL " + f.lvl + "!");
    // Evolution is checked here — the one place a level actually changes — and
    // resolved AFTER the battle, like the originals.
    const sp = speciesOf(f);
    if (sp.evolvesAt && f.lvl >= sp.evolvesAt && SPECIES[sp.evolvesTo]) {
      (game.pendingEvos = game.pendingEvos || []).push({ f: f, to: sp.evolvesTo });
    }
    for (const [lv, id] of speciesOf(f).learnset || []) {
      if (lv > before && lv <= f.lvl && !f.moves.some(m => m.id === id)) {
        if (f.moves.length < MOVE_MAX) {
          f.moves.push({ id, pp: MOVES[id].pp });
          lines.push(nameOf(f) + " LEARNED " + MOVES[id].name + "!");
        } else {
          // Four moves already: queue a decision instead of silently refusing.
          // Resolved after the battle text finishes, in MODE.LEARN.
          (game.pendingLearns = game.pendingLearns || []).push({ f: f, id: id });
          lines.push(nameOf(f) + " WANTS TO LEARN " + MOVES[id].name + "!");
        }
      }
    }
  }
  return lines;
}

// Gen 1's catch maths, simplified to one shake check. A weakened target is much
// easier — which is what makes "fight it down first" the right play.
function catchOdds(foe) {
  const sp = speciesOf(foe);
  if (!sp.catchRate) return 0;
  const max = maxHpOf(foe);
  let f = Math.floor(((3 * max - 2 * foe.hp) * sp.catchRate) / (3 * max));
  // Gen 1's status bonus: sleep helps a lot, any other ailment a little.
  if (foe.status === "SLP") f += 25;
  else if (foe.status) f += 12;
  return Math.min(255, Math.max(1, f)) / 255;
}

// The real Gen 1 damage formula, including the 217..255 random spread.
function damageCalc(level, power, atk, def, mult) {
  let d = Math.floor(Math.floor(Math.floor(2 * level / 5 + 2) * power * atk / def) / 50) + 2;
  d = Math.floor(d * mult);
  const spread = (217 + Math.floor(Math.random() * 39)) / 255;
  return Math.max(1, Math.floor(d * spread));
}

function effectiveness(atkType, defType) {
  return (TYPE_CHART[atkType] && TYPE_CHART[atkType][defType]) || 1;
}

// ---------------------------------------------------------------- state

const MODE = { WORLD: "world", TEXT: "text", BATTLE: "battle", LOG: "log", SHEET: "sheet", TRAVEL: "travel", TITLE: "title", LEARN: "learn", SHOP: "shop", EVOLVE: "evolve", MENU: "menu", BAG: "bag", PARTY: "party", BOX: "box", CONFIRM: "confirm" };

// A generic yes/no gate: Z runs the callback, X returns to the world. Built for
// LOAD (which destroys unsaved progress) but reusable by anything destructive.
function askConfirm(lines, yes) {
  game.confirm = { lines, yes };
  game.mode = MODE.CONFIRM;
  clearPressed();
}

const game = {
  mode: MODE.WORLD,
  map: null,
  mapId: null,
  frame: 0,
  player: { x: 4, y: 6, dir: "down", walking: false, stepFrame: 0, dx: 0, dy: 0, animFrame: 0 },
  cam: { x: 0, y: 0 },
  text: { pages: [], page: 0, chars: 0, done: false, after: null },
  battle: null,
  fadeFrames: 0,
  logPage: 0,
  travelIdx: 0,
  shopIdx: 0,
  shopTab: 0,
  confirm: null,
  menuIdx: 0,
  bagIdx: 0,
  partyIdx: 0,
  boxIdx: 0,
  useItem: null,   // set while the bag is picking a target to heal
};

const STARTER_LEVEL = 5;
const CAGE_RESTOCK = 5;

// The party lives in the play ledger (localStorage), NOT in the crew data.
// Luffy starts at level 5 here regardless of what the award log says his work
// level is — the two numbers are different things that happen to share a name,
// and the whole point of tonight's decision is that they never touch. A crew
// award must not make your starter hit harder, and grinding tall grass must not
// move his bounty.
function activeFighter() {
  return play.party.find(f => !isFainted(f)) || play.party[0];
}
function partyWiped() { return play.party.every(isFainted); }

function ensureParty() {
  if (!Array.isArray(play.party) || !play.party.length) {
    play.party = [makeFighter("luffy", STARTER_LEVEL)];
  }
  // Repair rather than trust: this comes back from localStorage, which a stale
  // save or a hand-edit can leave malformed, and a party member with no moves
  // would soft-lock the battle menu.
  play.party = play.party.filter(f => f && SPECIES[f.id]).slice(0, PARTY_MAX);
  play.party.forEach(f => {
    if (typeof f.lvl !== "number" || f.lvl < 1) f.lvl = STARTER_LEVEL;
    if (typeof f.xp !== "number") f.xp = xpToReach(f.lvl);
    if (!Array.isArray(f.moves) || !f.moves.length) {
      f.moves = movesAtLevel(f.id, f.lvl).map(id => ({ id, pp: MOVES[id].pp }));
    }
    f.moves = f.moves.filter(m => MOVES[m.id]).slice(0, MOVE_MAX);
    if (typeof f.hp !== "number") f.hp = maxHpOf(f);
    f.hp = Math.max(0, Math.min(f.hp, maxHpOf(f)));
  });
  if (typeof play.cages !== "number") play.cages = CAGE_RESTOCK;
  // One-time migration: cages used to be a bare counter, before there was a bag.
  if (!play.items || typeof play.items !== "object") {
    play.items = { cage: play.cages, meat: 1 };
  }
  for (const id of Object.keys(play.items)) {
    if (!ITEMS[id]) delete play.items[id];   // drop anything a stale save invented
  }
  if (typeof play.belly !== "number") play.belly = 500;
  if (!play.trainers || typeof play.trainers !== "object") play.trainers = {};
  if (!play.badges || typeof play.badges !== "object") play.badges = {};
  if (!play.legends || typeof play.legends !== "object") play.legends = {};
  if (!play.recruited || typeof play.recruited !== "object") play.recruited = {};
  if (!Array.isArray(play.box)) play.box = [];
  if (!play.visited || typeof play.visited !== "object") play.visited = {};
  if (!play.quests || typeof play.quests !== "object") play.quests = {};
  // Save migration: gives-items arrived AFTER some badges were already earned.
  // A save that beat Smoker before the Log Pose existed can never re-fight him
  // and is soft-locked out of the Grand Line — backfill any item a beaten
  // trainer would have handed over. Generic on purpose: every future key item
  // tied to an already-beaten trainer heals the same way.
  for (const tid in TRAINERS) {
    const t = TRAINERS[tid];
    if (t.gives && ITEMS[t.gives] && trainerBeaten(tid) && itemCount(t.gives) <= 0) {
      play.items[t.gives] = 1;
    }
  }
  savePlay();
  play.box = play.box.filter(f => f && SPECIES[f.id]);
  savePlay();
}

function healParty() {
  play.party.forEach(healFighter);
  if (itemCount("cage") < CAGE_RESTOCK) play.items.cage = CAGE_RESTOCK;
  savePlay();
}

// ---------------------------------------------------------------- map access

function blockAt(map, x, y) {
  if (y < 0 || y >= map.rows.length) return null;
  const row = map.rows[y];
  if (x < 0 || x >= row.length) return null;
  return BLOCKS[row[x]] || null;
}

function npcAt(map, x, y) {
  return (map.npcs || []).find(n => n.x === x && n.y === y) || null;
}

function warpAt(map, x, y) {
  return (map.warps || []).find(w => w.x === x && w.y === y) || null;
}

function signAt(map, x, y) {
  return (map.signs || []).find(s => s.x === x && s.y === y) || null;
}

function walkable(map, x, y) {
  const b = blockAt(map, x, y);
  if (!b || b.solid) return false;
  if (npcAt(map, x, y)) return false;
  return true;
}

function loadMap(id, x, y, dir) {
  game.mapId = id;
  game.map = MAPS[id];
  game.player.x = x;
  game.player.y = y;
  if (dir) game.player.dir = dir;
  game.player.walking = false;
  game.player.stepFrame = 0;
  game.player.dx = 0;
  game.player.dy = 0;
  game.fadeFrames = 12;
  updateCamera(true);
  // Where you are is part of the save — walk out of a map and the game
  // remembers it, so closing the window doesn't reset the voyage.
  play.pos = { map: id, x, y, dir: game.player.dir };
  play.visited[id] = true;
  savePlay();
  if (game.map.heals && play.party.length) {
    const hurt = play.party.some(f => f.hp < maxHpOf(f)) ||
                 play.party.some(f => f.moves.some(m => m.pp < MOVES[m.id].pp)) ||
                 play.cages < CAGE_RESTOCK;
    if (hurt) {
      healParty();
      say(["THE CREW PATCHES YOU UP.", "PARTY HEALED AND CAGES RESTOCKED."]);
    }
  }
}

function updateCamera(snap) {
  const map = game.map;
  const mapW = map.rows[0].length, mapH = map.rows.length;
  const px = game.player.x * BLK + game.player.dx;
  const py = game.player.y * BLK + game.player.dy;
  let cx = px + BLK / 2 - W / 2;
  let cy = py + BLK / 2 - H / 2;
  // Clamp so the camera never shows past the map edge. A map smaller than the
  // screen (the ship) pins to 0 instead of centring — same as the real games.
  // A map smaller than the screen is CENTERED (negative camera), not pinned
  // to a corner — on the DS-sized screen the ship and the gyms would otherwise
  // huddle top-left with dead space right and below.
  const spanX = mapW * BLK - W, spanY = mapH * BLK - H;
  game.cam.x = spanX <= 0 ? Math.round(spanX / 2) : Math.max(0, Math.min(spanX, Math.round(cx)));
  game.cam.y = spanY <= 0 ? Math.round(spanY / 2) : Math.max(0, Math.min(spanY, Math.round(cy)));
  if (snap) { /* nothing extra — camera is already absolute */ }
}

// ---------------------------------------------------------------- dialogue

const TEXT_COLS = 38;   // the DS-width textbox holds real sentences

function wrap(line) {
  const words = String(line).toUpperCase().split(/\s+/);
  const out = [];
  let cur = "";
  for (const w of words) {
    if (!cur.length) { cur = w; continue; }
    if ((cur + " " + w).length <= TEXT_COLS) cur += " " + w;
    else { out.push(cur); cur = w; }
  }
  if (cur.length) out.push(cur);
  return out;
}

// Pages of two lines each — the textbox is 2 lines tall, like the original.
function paginate(lines) {
  const flat = [];
  for (const l of lines) for (const w of wrap(l)) flat.push(w);
  const pages = [];
  for (let i = 0; i < flat.length; i += 2) pages.push(flat.slice(i, i + 2));
  return pages.length ? pages : [[""]];
}

// ------------------------------------------------------------- the main goal
//
// A player who has never seen this game gets ninety seconds before they decide
// it is a tech demo. The world already has a real spine — ship, town, first
// duel, first gym — but nothing ever SAYS it, so a newcomer walks in circles on
// the deck. This is that spine, spoken out loud.
//
// DERIVED, never stored. Same rule as the level curve and the island gates: the
// goal is read off badges/duels/visits every time it is asked for, so a save
// from an older build can't disagree with the world it is standing in. The only
// thing persisted is which goal was last ANNOUNCED (play.goalSeen), which is a
// fact about the telling, not about the world.
function mainGoal() {
  if (!play.visited.shells)
    return { id: "ashore", lines: ["GO ASHORE.", "SHELLS TOWN IS SOUTH,", "DOWN THROUGH THE HATCH."] };

  if (!play.trainers.zoro_duel)
    return { id: "zoro", lines: ["FIND ZORO IN SHELLS TOWN.", "BEAT HIM AND HE SAILS", "WITH YOU."] };

  if (!play.badges.east_blue) {
    // Standing in the right town already — don't send them sailing again.
    const here = game.mapId;
    if (here === "logue" || here === "gym_logue")
      return { id: "smoker", lines: ["SMOKER IS IN THE GYM.", "BEAT HIM FOR THE FIRST", "BADGE."] };
    return { id: "logue", lines: ["SAIL TO LOGUETOWN.", "THE HELM IS ON THE SUNNY.", "SMOKER HAS THE FIRST BADGE."] };
  }

  if (!play.badges.alabasta)
    return { id: "alabasta", lines: ["THE LOG POSE OPENS NEW SEAS.", "CROC HOLDS THE DESERT BADGE", "IN ALABASTA."] };

  return { id: "garp", lines: ["TWO BADGES.", "GARP IS WAITING IN ALABASTA.", "HE HITS HARDER THAN ANYONE."] };
}

// Announce it once, the moment it changes — which is exactly when it is useful
// ("you beat Zoro; now sail"). Returns true if it took over the screen, so the
// caller stops rather than running a world frame underneath a textbox.
function goalNudge() {
  const goal = mainGoal();
  if (play.goalSeen === goal.id) return false;
  play.goalSeen = goal.id;
  savePlay();
  say(["GOAL"].concat(goal.lines));
  return true;
}

function say(lines, after) {
  game.text.pages = paginate(lines);
  game.text.page = 0;
  game.text.chars = 0;
  game.text.done = false;
  game.text.after = after || null;
  game.mode = MODE.TEXT;
}

function currentPageText() {
  return (game.text.pages[game.text.page] || []).join("\n");
}

function advanceText() {
  const full = currentPageText().length;
  if (game.text.chars < full) { game.text.chars = full; return; }
  if (game.text.page < game.text.pages.length - 1) {
    game.text.page++;
    game.text.chars = 0;
    return;
  }
  const after = game.text.after;
  game.text.after = null;
  game.mode = MODE.WORLD;
  if (after) after();
}

// ---------------------------------------------------------------- NPC lines

function crewLines(member) {
  const lines = [
    member.name.toUpperCase() + ": " + member.domain.toUpperCase() + ".",
    "LEVEL " + member.level + "   " + berry(member.bounty),
  ];
  if (member.domain_echo) lines.push(member.domain_echo);
  else if (member.ability) lines.push(member.ability);
  lines.push(member.has_subagent
    ? "I HAVE A REAL AGENT FILE. CROSS MY NEXT THRESHOLD AND WE SHARPEN IT."
    : "NO AGENT FILE YET. CROSS MY FIRST THRESHOLD AND YOU BUILD ME ONE.");
  return lines;
}

function gateLines() {
  if (!ROUTE) {
    return ["A MARINE BLOCKS THE GATE.",
            "NO CREW LOG LOADED, SO THERE'S NOTHING TO CHECK. LAUNCH FROM CLAUDE+."];
  }
  const next = ROUTE.next_island;
  const total = ROUTE.total_crew_xp || 0;
  if (!next) {
    return ["MARINE: THE WHOLE GRAND LINE IS BEHIND YOU.",
            "THERE IS NOTHING LEFT FOR ME TO GUARD."];
  }
  return [
    "MARINE: THIS GATE OPENS FOR " + next.name.toUpperCase() + ".",
    "CREW XP " + commas(total) + " / " + commas(next.gate) + ".",
    commas(next.xp_away) + " MORE AND THE ROAD IS YOURS.",
    next.note || "",
  ].filter(Boolean);
}

function populateNpcs() {
  // Rebuilt from the roster every load, so a fresh award shows up as new
  // dialogue rather than a stale line.
  const town = MAPS.shells;
  town.npcs = [];
  if (CREW.length) {
    CREW.forEach((member, i) => {
      const spot = town.crewSpots[i];
      if (!spot) return;
      // Fall back to the generic sprite for any crew member without a head
      // block — a new roster row must cost a silhouette, not a crash.
      const key = "npc_" + member.name.toUpperCase();
      const r = RECRUITABLE[member.name.toUpperCase()];
      const aboard = r && play.recruited && play.recruited[r.name];
      // The duel only lives here if Shells Town is actually their arc — which
      // is Zoro alone. Everyone else keeps their roster flavour line here and
      // is recruited on their own island. Their real numbers still show up in
      // this dialogue either way; that is the crew ledger being displayed, and
      // it has nothing to do with where or whether you can fight them.
      const duel = r && !aboard && r.map === "shells" ? TRAINERS[r.trainer] : null;
      town.npcs.push({
        x: spot.x, y: spot.y, dir: "down",
        sprite: SPRITES[key] ? key : "npc",
        // The roster lines stay exactly as they were — real level and bounty,
        // as flavour that the duel never reads.
        lines: aboard ? crewLines(member).concat([r.name + ": STILL WITH YOU."])
                      : crewLines(member),
        trainer: duel,
      });
    });
  } else {
    town.npcs.push({
      x: town.crewSpots[0].x, y: town.crewSpots[0].y, sprite: "npc", dir: "down",
      lines: ["THE CREW LOG ISN'T LOADED.",
              "RUN GENERATE.PY, OR LAUNCH THIS FROM THE CLAUDE+ APP."],
    });
  }
  applyWorldState();

  // The helm. Interacting with it opens the travel menu, which is where the
  // real crew XP actually buys you something: an island you have not reached
  // cannot be sailed to.
  MAPS.sunny.npcs = [{
    x: 7, y: 2, sprite: "npc", dir: "down", action: "travel",
    lines: ["TAKE THE HELM?"],
  }];

  // logue/alabasta npcs are NOT set here — applyWorldState() above owns them,
  // locals included, so a boss placed there survives boot.
}

// Everything that depends on what you have beaten, recomputed in one place so
// the world can never disagree with the save. Called at boot and after any
// battle that could have changed it.
function applyWorldState() {
  const r1 = MAPS.route1;
  const open = trainerBeaten("gate_marine");

  // The gate block becomes a warp once its guard is beaten.
  r1.rows[11] = open ? "TTTTTTTTTTT^TTTT" : "TTTTTTTTTTTKTTTT";
  r1.warps = [{ x: 6, y: 0, to: "shells", tx: 6, ty: 12, dir: "up" }];
  if (open) r1.warps.push({ x: 11, y: 11, to: "route2", tx: 6, ty: 9, dir: "up" });

  const marine = TRAINERS.gate_marine;
  r1.npcs = [{
    watch: "up",
    // He steps off the path once beaten, or he would stand on the gate he just
    // opened and block it.
    x: open ? 12 : r1.gateSpot.x,
    y: r1.gateSpot.y,
    sprite: "marine", dir: "down",
    trainer: marine,
    lines: open ? marine.beaten : marine.intro,
  }];

  // The ONE place these maps' npcs get built: flavour locals first, then
  // everything progress-dependent stacked on top. populateNpcs() used to ALSO
  // assign logue/alabasta npcs *after* calling this, so anything placed here
  // was wiped at boot and only appeared after the next battle recomputed it.
  for (const mapId of ["route2", "gym_logue", "gym_alabasta", "logue", "alabasta", "house_shells", "syrup", "baratie", "arlong", "drum"]) {
    const m = MAPS[mapId];
    m.npcs = (m.locals || []).map(n => ({ ...n, dir: n.dir || "down" }));
    for (const spot of m.trainerSpots || []) {
      const t = TRAINERS[spot.trainer];
      m.npcs.push({
        x: spot.x, y: spot.y, sprite: spot.sprite,
        dir: spot.watch || "down",
        watch: spot.watch || "down",
        trainer: t,
        lines: trainerBeaten(t.id) ? t.beaten : t.intro,
      });
    }
    // A boss is a trainer with no `watch` (so it is talk-triggered, never
    // sight-triggered) gated on real PLAY progress — badges, never crew XP.
    // Rule 3: the world is never gated by work.
    for (const spot of m.bossSpots || []) {
      if (badgeCount() < (spot.needsBadges || 0)) continue;
      const t = TRAINERS[spot.trainer];
      m.npcs.push({
        x: spot.x, y: spot.y, sprite: spot.sprite, dir: "down",
        trainer: t,
        lines: trainerBeaten(t.id) ? t.beaten : t.intro,
      });
    }
    // Crew members waiting on their own island. Placed here rather than with
    // the roster NPCs because their arc is somewhere other than Shells Town.
    for (const key in RECRUITABLE) {
      const r = RECRUITABLE[key];
      if (r.map !== mapId || !TRAINERS[r.trainer]) continue;
      if (play.recruited && play.recruited[r.name]) continue;
      m.npcs.push({
        x: r.x, y: r.y, dir: "down",
        sprite: SPRITES[r.sprite] ? r.sprite : "npc",
        trainer: TRAINERS[r.trainer],
        lines: TRAINERS[r.trainer].intro,
      });
    }
    // Legendaries stand in the world until beaten or caught, then never again.
    // No `watch`: a legendary does not chase you down — you walk up to it.
    for (const spot of m.legendSpots || []) {
      if (play.legends && play.legends[spot.species]) continue;
      m.npcs.push({
        x: spot.x, y: spot.y, sprite: spot.sprite, dir: "down",
        legend: { species: spot.species, lvl: spot.lvl },
      });
    }
  }
}

function badgeCount() { return Object.keys(play.badges || {}).length; }

// Which islands from the real route actually have a map built. Everything else
// is honest about being unbuilt rather than silently missing.
const ISLAND_MAPS = {
  "Shells Town": { map: "shells", x: 6, y: 5, dir: "down" },
  "Loguetown": { map: "logue", x: 6, y: 2, dir: "down" },
  "Alabasta": { map: "alabasta", x: 5, y: 12, dir: "up" },
};

function travelOptions() {
  // The route's NAMES come from the real award log; nothing else does.
  //
  // Changed 2026-08-05 on his instruction — "I should be able to move freely in
  // the world and not be related to the characters of my Claude+ skills/agents".
  // Sailing used to be locked behind crew XP, which quietly made the game's
  // world a progress meter for work. It is a game: every port with a map is
  // open. The crew's real numbers stay visible as flavour that cannot stop you.
  if (!ROUTE || !ROUTE.islands) return [];
  const opts = ROUTE.islands.map(i => ({
    name: i.name,
    reached: i.reached,
    xpAway: i.xp_away,
    dest: ISLAND_MAPS[i.name] || null,
    lock: portLock((ISLAND_MAPS[i.name] || {}).requires),
  }));
  // Game-only ports: canon arc stops that are NOT on the crew's real sea chart.
  // The chart belongs to the award log; the WORLD belongs to the game. Adding a
  // port here is how an arc island becomes sailable without touching real data
  // (the two-ledger rule) — building the island is what unlocks its character.
  for (const port of GAME_PORTS) {
    const entry = { name: port.name, reached: true, xpAway: 0, dest: port.dest,
                    lock: portLock(port.requires) };
    // Spliced into canon order, not appended — an East Blue village listed
    // after Laugh Tale would be wrong twice: off the bottom of the scroll
    // window, and out of story order.
    const at = opts.findIndex(o => o.name === port.after);
    if (at >= 0) opts.splice(at + 1, 0, entry);
    else opts.push(entry);
  }
  return opts;
}

const GAME_PORTS = [
  { name: "Syrup Village", after: "Shells Town",
    dest: { map: "syrup", x: 7, y: 8, dir: "up" } },
  { name: "The Baratie", after: "Syrup Village",
    dest: { map: "baratie", x: 5, y: 7, dir: "up" } },
  { name: "Arlong Park", after: "The Baratie",
    dest: { map: "arlong", x: 6, y: 9, dir: "up" } },
  // Canon order: the crew reaches Drum BEFORE Alabasta (Vivi's route), so it
  // splices after Reverse Mountain, not after the desert.
  { name: "Drum Island", after: "Reverse Mountain",
    dest: { map: "drum", x: 6, y: 9, dir: "up" },
    requires: { item: "log_pose",
                lines: ["THE GRAND LINE IGNORES MAPS.",
                        "ONLY A LOG POSE READS IT -",
                        "THE LOGUETOWN GYM HOLDS ONE."] } },
];

// The forced structure, his call: one place leads to the next. A lock is
// ALWAYS play-earned — an item, a badge, a place stood in — never crew XP;
// the two-ledger rule still holds. East Blue stays open as the tutorial sea.
ISLAND_MAPS["Alabasta"].requires = {
  visited: "drum",
  lines: ["THE LOG POSE POINTS TO DRUM FIRST.",
          "IT MUST SETTLE THERE BEFORE",
          "IT WILL FIND THE DESERT."] };

function portLock(req) {
  if (!req) return null;
  if (req.item && itemCount(req.item) <= 0) return req;
  if (req.visited && !play.visited[req.visited]) return req;
  if (req.badge && !play.badges[req.badge]) return req;
  return null;
}

// ---------------------------------------------------------------- sound

// Square-wave blips, built the way the hardware would have: no samples, no
// files, one oscillator per sound. Three deliberate constraints:
//   - the AudioContext is created on the first real keypress and never before,
//     because browsers only allow audio to start from a user gesture AND
//     because src/shot must never touch an audio device just to take a picture;
//   - every call is wrapped, and a single failure sets audioOk=false for good,
//     so a blocked or missing audio stack costs sound and nothing else;
//   - muting is persisted in the play ledger, like everything else recreational.
let audioCtx = null;
let audioOk = true;
let userGestured = false;   // set by the first real keydown, never by a snapshot

function ensureAudio() {
  // Hard gate, not a hopeful one: without a gesture the browser would refuse
  // anyway, and this is what actually keeps src/shot from opening an audio
  // device just to render a PNG.
  if (!userGestured) return null;
  if (audioCtx || !audioOk) return audioCtx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { audioOk = false; return null; }
    audioCtx = new AC();
  } catch (e) {
    audioOk = false;
  }
  return audioCtx;
}

function blip(freq, ms, type, vol) {
  if (play.mute) return;
  const ac = ensureAudio();
  if (!ac) return;
  try {
    if (ac.state === "suspended" && ac.resume) ac.resume();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ac.destination);
    const t = ac.currentTime;
    const peak = vol === undefined ? 0.05 : vol;
    gain.gain.setValueAtTime(peak, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    osc.start(t);
    osc.stop(t + ms / 1000);
  } catch (e) {
    audioOk = false;
  }
}

function chord(notes, step, type) {
  notes.forEach((f, i) => setTimeout(() => blip(f, step, type), i * step));
}

const SFX = {
  text:   () => blip(660, 14, "square", 0.03),
  cursor: () => blip(440, 22),
  ok:     () => blip(780, 45),
  hit:    () => blip(180, 70, "sawtooth", 0.06),
  faint:  () => chord([300, 240, 170], 90, "square"),
  level:  () => chord([520, 660, 880], 80, "square"),
  caught: () => chord([600, 760, 1000], 70, "square"),
};

// ---------------------------------------------------------------- input

const held = {};
const pressed = {};
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right",
  KeyZ: "a", Enter: "a", Space: "a",
  KeyX: "b", Backspace: "b", Escape: "b",
  KeyM: "mute",
};

window.addEventListener("keydown", e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  userGestured = true;
  e.preventDefault();
  if (!held[k]) pressed[k] = true;
  held[k] = true;
});
window.addEventListener("keyup", e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  held[k] = false;
});
function took(key) {
  if (pressed[key]) { pressed[key] = false; return true; }
  return false;
}
function clearPressed() { for (const k in pressed) pressed[k] = false; }

// ---------------------------------------------------------------- world tick

const DIR_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function tryInteract() {
  const map = game.map;
  const [vx, vy] = DIR_VEC[game.player.dir];
  const tx = game.player.x + vx, ty = game.player.y + vy;
  const npc = npcAt(map, tx, ty);
  if (npc) {
    // NPCs turn to face you — cheap, and its absence is instantly noticeable.
    npc.dir = { up: "down", down: "up", left: "right", right: "left" }[game.player.dir];
    if (npc.trainer && !trainerBeaten(npc.trainer.id)) {
      say(npc.trainer.intro, () => startTrainerBattle(npc.trainer));
      return true;
    }
    if (npc.legend) {
      const sp = SPECIES[npc.legend.species];
      say(["THE WATER STIRS...", "THE " + sp.name + " RISES TO FIGHT!"],
          () => startStaticBattle(npc.legend.species, npc.legend.lvl));
      return true;
    }
    if (npc.questGive && QUESTS[npc.questGive]) {
      const q = QUESTS[npc.questGive];
      const st = play.quests[npc.questGive];
      if (!st) {
        play.quests[npc.questGive] = "started"; savePlay();
        say(q.give);
      } else if (st === "started") {
        say(q.remind);
      } else if (st === "ready") {
        play.quests[npc.questGive] = "done"; savePlay();
        SFX.caught();
        say(q.done.concat(questReward(q)));
      } else {
        say(npc.lines);   // done: back to their ordinary life
      }
      return true;
    }
    if (npc.questAdvance && QUESTS[npc.questAdvance] &&
        play.quests[npc.questAdvance] === "started") {
      play.quests[npc.questAdvance] = "ready"; savePlay();
      SFX.ok();
      say(QUESTS[npc.questAdvance].advance);
      return true;
    }
    if (npc.action === "shop") {
      say(npc.lines, () => {
        game.shopIdx = 0;
        game.shopTab = 0;
        game.mode = MODE.SHOP;
        clearPressed();
      });
      return true;
    }
    if (npc.action === "travel") {
      say(npc.lines, () => {
        game.travelIdx = Math.max(0, (ROUTE && ROUTE.sunny_index) || 0);
        game.mode = MODE.TRAVEL;
        clearPressed();
      });
      return true;
    }
    say(npc.lines);
    return true;
  }
  const sign = signAt(map, tx, ty);
  if (sign) { say(sign.lines); return true; }
  return false;
}

// A trainer sees you down a clear line in the direction they are watching, walks
// up, and challenges. The single biggest "this is a Pokemon game" tell after the
// battle screen itself.
const SIGHT_RANGE = 4;

function sightDistance(npc) {
  const watch = npc.watch || npc.dir || "down";
  const [vx, vy] = DIR_VEC[watch];
  for (let step = 1; step <= SIGHT_RANGE; step++) {
    const tx = npc.x + vx * step, ty = npc.y + vy * step;
    if (game.player.x === tx && game.player.y === ty) return step;
    const b = blockAt(game.map, tx, ty);
    if (!b || b.solid) return 0;          // wall breaks the line
    if (npcAt(game.map, tx, ty)) return 0; // so does another person
  }
  return 0;
}

function checkTrainerSight() {
  if (game.sighting) return false;
  for (const npc of game.map.npcs || []) {
    // Sight is opt-in via `watch`. Without this guard sightDistance() falls
    // back to npc.dir, so any stationary trainer would silently grow a line of
    // sight in whatever direction it happened to be facing — which would have
    // let a talk-only boss challenge you from four tiles away.
    if (!npc.trainer || !npc.watch || trainerBeaten(npc.trainer.id)) continue;
    const dist = sightDistance(npc);
    if (dist > 0) {
      // Walk up to one tile short of the player, then talk.
      game.sighting = { npc: npc, phase: "alert", t: 0, left: dist - 1 };
      SFX.ok();
      return true;
    }
  }
  return false;
}

function sightingTick() {
  const sg = game.sighting;
  const npc = sg.npc;
  sg.t++;
  if (sg.phase === "alert") {
    if (sg.t > 42) { sg.phase = "walk"; sg.t = 0; }
    return;
  }
  if (sg.phase === "walk") {
    if (sg.left <= 0) {
      sg.phase = "talk";
      game.sighting = null;
      // Face the player, then challenge.
      npc.dir = { up: "down", down: "up", left: "right", right: "left" }[
        npc.watch || "down"] || "down";
      say(npc.trainer.intro, () => startTrainerBattle(npc.trainer));
      return;
    }
    if (sg.t % 8 === 0) {
      const [vx, vy] = DIR_VEC[npc.watch || "down"];
      npc.x += vx; npc.y += vy;
      sg.left--;
    }
    return;
  }
}

function onStepComplete() {
  const map = game.map;
  const warp = warpAt(map, game.player.x, game.player.y);
  if (warp) {
    if (warp.to) {
      loadMap(warp.to, warp.tx, warp.ty, warp.dir);
      return;
    }
    if (warp.msg) { say([warp.msg]); return; }
  }
  if (checkTrainerSight()) return;   // a challenge beats a wild encounter
  const b = blockAt(map, game.player.x, game.player.y);
  if (b && b.encounter && Math.random() < ENCOUNTER_RATE) startBattle();
}

function worldTick() {
  const p = game.player;
  if (game.sighting) { sightingTick(); return; }

  // Between steps only: interrupting mid-stride would leave the player halfway
  // into a tile with a textbox over them.
  if (!p.walking && goalNudge()) return;

  if (p.walking) {
    p.stepFrame++;
    p.dx = p.dirVec[0] * p.stepFrame * (BLK / STEP_FRAMES);
    p.dy = p.dirVec[1] * p.stepFrame * (BLK / STEP_FRAMES);
    // Animation swaps at the halfway point of each step.
    p.animFrame = p.stepFrame > STEP_FRAMES / 2 ? 1 : 0;
    if (p.stepFrame >= STEP_FRAMES) {
      p.x += p.dirVec[0];
      p.y += p.dirVec[1];
      p.dx = 0; p.dy = 0;
      p.walking = false;
      p.stepFrame = 0;
      p.stepsTaken = (p.stepsTaken || 0) + 1;
      p.animFrame = (p.stepsTaken % 2);
      play.steps++;
      if (play.pos) { play.pos.x = p.x; play.pos.y = p.y; play.pos.dir = p.dir; }
      if (play.steps % 20 === 0) savePlay();   // batched: a write per step is waste
      updateCamera();
      onStepComplete();
      return;
    }
    updateCamera();
    return;
  }

  if (took("a") && tryInteract()) return;
  if (took("b")) { game.mode = MODE.MENU; game.menuIdx = 0; savePlay(); return; }

  const dir = ["up", "down", "left", "right"].find(d => held[d]);
  if (!dir) { p.animFrame = 0; return; }

  // Face first, move second: a direction change costs one press, exactly like
  // the originals, which is what makes talking to an NPC beside you feel right.
  if (p.dir !== dir) {
    p.dir = dir;
    p.turnDelay = 4;
    return;
  }
  if (p.turnDelay && p.turnDelay-- > 0) return;

  const [vx, vy] = DIR_VEC[dir];
  if (!walkable(game.map, p.x + vx, p.y + vy)) {
    p.animFrame = 0;
    return;
  }
  p.walking = true;
  p.stepFrame = 0;
  p.dirVec = [vx, vy];
}

// ---------------------------------------------------------------- battle

// The four-option menu, laid out 2x2 the way the originals did it.
const BATTLE_MENU = ["FIGHT", "BAG", "SWAP", "RUN"];

// A trainer fight: their whole party, in order, no catching and no running.
function startTrainerBattle(trainer) {
  ensureParty();
  const hero = activeFighter();
  const foes = trainer.party.map(([id, lvl]) => makeFighter(id, lvl));
  game.battle = {
    hero,
    foe: foes[0],
    speciesId: trainer.party[0][0],
    trainer,
    foeQueue: foes.slice(1),
    phase: "intro",
    menu: 0, moveIdx: 0, swapIdx: 0,
    flash: 0, entry: 14,
    heroHpShown: hero.hp,
    foeHpShown: foes[0].hp,
  };
  game.mode = MODE.BATTLE;
  clearPressed();
  // "ZORO SENDS OUT ZORO!" — a person who fights you personally needs its own
  // opener, so a trainer may supply one.
  queueText([trainer.openLine ||
             (trainer.name + " SENDS OUT " + nameOf(foes[0]) + "!")],
            () => { game.battle.phase = "menu"; });
}

// A static (legendary) battle: wild rules — you can cage it, you can run —
// but the species and level are pinned, and winning or catching removes it
// from the world for good (marked in foeFainted / tryCatch).
function startStaticBattle(speciesId, lvl) {
  ensureParty();
  const hero = activeFighter();
  const foe = makeFighter(speciesId, lvl);
  play.seen[speciesId] = (play.seen[speciesId] || 0) + 1;
  savePlay();
  game.battle = {
    hero, foe, speciesId,
    legend: true,
    phase: "intro",
    menu: 0, moveIdx: 0, swapIdx: 0,
    flash: 0, entry: 14,
    heroHpShown: hero.hp,
    foeHpShown: foe.hp,
  };
  game.mode = MODE.BATTLE;
  clearPressed();
  queueText([nameOf(foe) + " ATTACKS!"], () => { game.battle.phase = "menu"; });
}

function startBattle() {
  ensureParty();
  const hero = activeFighter();
  const pool = encounterPool(game.mapId);
  const speciesId = pool[Math.floor(Math.random() * pool.length)];
  const lvl = Math.max(2, hero.lvl - 2 + Math.floor(Math.random() * 4));
  const foe = makeFighter(speciesId, lvl);
  play.seen[speciesId] = (play.seen[speciesId] || 0) + 1;
  savePlay();
  game.battle = {
    // A live reference into play.party, not a copy: damage, PP and XP all have
    // to survive the battle, and the alternative (copy out, merge back) is where
    // "my level-up vanished" bugs live.
    hero, foe, speciesId,
    phase: "intro",
    menu: 0,
    moveIdx: 0,
    swapIdx: 0,
    flash: 0,
    // Entry wipe. Cutting straight from the overworld to the battle screen is
    // the single most jarring frame in the game; a dozen frames of scanline
    // clears that up for almost nothing.
    entry: 14,
    heroHpShown: hero.hp,
    foeHpShown: foe.hp,
  };
  game.mode = MODE.BATTLE;
  clearPressed();
  queueText(["A WILD " + nameOf(foe) + " APPEARED!"],
            () => { game.battle.phase = "menu"; });
}

// Battle text uses its own queue so a whole exchange can be scripted up front
// and then walked through one A press at a time.
function queueText(lines, after) {
  const b = game.battle;
  b.phase = "text";
  b.text = { pages: paginate(lines), page: 0, chars: 0 };
  b.textAfter = after || null;
}

function battleAdvanceText() {
  const b = game.battle;
  const full = (b.text.pages[b.text.page] || []).join("\n").length;
  if (b.text.chars < full) { b.text.chars = full; return; }
  if (b.text.page < b.text.pages.length - 1) {
    b.text.page++; b.text.chars = 0; return;
  }
  const after = b.textAfter;
  b.textAfter = null;
  if (after) after();
}

function effectLine(mult) {
  if (mult >= 2) return "IT'S SUPER EFFECTIVE!";
  if (mult > 0 && mult < 1) return "IT'S NOT VERY EFFECTIVE...";
  return null;
}

function heroAttack(moveIdx) {
  const b = game.battle;
  // Status pre-checks come before the PP check, like the originals: a sleeping
  // fighter doesn't spend PP on the turn it can't take.
  const pre = [];
  if (b.hero.status === "SLP") {
    b.hero.slp = (b.hero.slp || 1) - 1;
    if (b.hero.slp > 0) {
      savePlay();
      queueText([nameOf(b.hero) + " IS FAST ASLEEP!"], foeAttack);
      return;
    }
    b.hero.status = null;
    pre.push(nameOf(b.hero) + " WOKE UP!");
  }
  if (b.hero.status === "PAR" && Math.random() < 0.25) {
    savePlay();
    queueText([nameOf(b.hero) + " IS PARALYZED!", "IT CAN'T MOVE!"], foeAttack);
    return;
  }
  const slot = b.hero.moves[moveIdx];
  const move = MOVES[slot.id];
  if (slot.pp <= 0) {
    queueText(["NO PP LEFT FOR THAT MOVE!"], () => { b.phase = "menu"; });
    return;
  }
  slot.pp--;
  const mult = effectiveness(move.type, typeOf(b.foe));
  const dmg = move.power > 0
    ? damageCalc(b.hero.lvl, move.power, battleAtkOf(b.hero), defOf(b.foe), mult)
    : 0;
  b.foe.hp = Math.max(0, b.foe.hp - dmg);
  const lines = pre.concat([nameOf(b.hero) + " USED " + move.name + "!"]);
  if (dmg > 0) {
    const eff = effectLine(mult);
    if (eff) lines.push(eff);
    b.flash = 6;
    SFX.hit();
  }
  if (move.heal) {
    const max = maxHpOf(b.hero);
    const amt = Math.min(max - b.hero.hp, Math.floor(max * move.heal));
    if (amt > 0) {
      b.hero.hp += amt;
      SFX.level();
      lines.push(nameOf(b.hero) + " PATCHED UP " + amt + " HP!");
    } else {
      lines.push("BUT IT FAILED!");
    }
  }
  if (move.effect) {
    if (b.foe.hp > 0 && applyStatus(b.foe, Math.random() < move.effect.chance ? move.effect.status : null)) {
      lines.push((b.trainer ? "" : "WILD ") + nameOf(b.foe) + " IS " +
                 STATUS_LABEL[move.effect.status] + "!");
    } else if (!move.power) {
      lines.push("BUT IT FAILED!");
    }
  }
  // Poison/burn bite the attacker after its own action, Gen 1 style — which
  // means a poisoned hero can knock itself out on its own turn.
  lines.push(...statusChip(b.hero, nameOf(b.hero)));
  savePlay();
  queueText(lines, () => {
    if (b.foe.hp <= 0) foeFainted();
    else if (b.hero.hp <= 0) heroDowned();
    else foeAttack();
  });
}

function foeFainted() {
  const b = game.battle;
  SFX.faint();
  if (b.trainer) {
    const lines = [nameOf(b.foe) + " FAINTED!"];
    lines.push(...grantXp(b.hero, xpYieldFor(b.foe)));
    savePlay();
    if (b.foeQueue.length) {
      const next = b.foeQueue.shift();
      lines.push(b.trainer.name + " SENDS OUT " + nameOf(next) + "!");
      queueText(lines, () => {
        b.foe = next;
        b.speciesId = next.id;
        b.foeHpShown = next.hp;
        b.phase = "menu";
      });
    } else {
      play.trainers[b.trainer.id] = true;
      play.battlesWon++;
      // Prize money scales off their strongest fighter, like the originals.
      const top = b.trainer.party.reduce((m, pr) => Math.max(m, pr[1]), 1);
      const prize = top * 90;
      play.belly += prize;
      const after = ["YOU BEAT " + b.trainer.name + "!",
                     "GOT " + berryShort(prize) + " PRIZE MONEY!"];
      if (b.trainer.badge) {
        play.badges[b.trainer.badge.id] = true;
        after.push("YOU RECEIVED THE " + b.trainer.badge.name + "!");
      }
      if (b.trainer.gives && ITEMS[b.trainer.gives] && itemCount(b.trainer.gives) <= 0) {
        giveItem(b.trainer.gives, 1);
        after.push(b.trainer.name.split(" ").pop() + " HANDED OVER THE " +
                   ITEMS[b.trainer.gives].name + "!");
      }
      // Beating a person can recruit them. The fight IS the recruitment.
      if (b.trainer.joins && SPECIES[b.trainer.joins.species]) {
        const j = b.trainer.joins;
        const f = makeFighter(j.species, j.lvl);
        const full = play.party.length >= PARTY_MAX;
        if (full) play.box.push(f); else play.party.push(f);
        play.recruited[j.name] = true;
        after.push(j.name + " JOINED THE CREW!");
        if (full) after.push("YOUR CREW IS FULL - SENT TO THE BOX.");
      }
      // A trainer may also hand over items — which is how the one unbuyable
      // item in the game (Garp's rice crackers) is obtained.
      if (b.trainer.reward && ITEMS[b.trainer.reward.item]) {
        const n = b.trainer.reward.n || 1;
        giveItem(b.trainer.reward.item, n);
        after.push("GOT " + n + " " + ITEMS[b.trainer.reward.item].name + "!");
      }
      savePlay();
      queueText(lines.concat(after, b.trainer.defeat), exitBattle);
    }
    return;
  }
  const lines = ["WILD " + nameOf(b.foe) + " FAINTED!"];
  // In-game XP, to the in-game party, on the in-game curve. This is the whole
  // recreational progression — and it is the one place someone might later be
  // tempted to also nudge the crew's real XP. Don't. See the two-ledger rule.
  lines.push(...grantXp(b.hero, xpYieldFor(b.foe)));
  play.beaten[b.speciesId] = (play.beaten[b.speciesId] || 0) + 1;
  play.battlesWon++;
  // A beaten legendary is gone for good — Gen 1's rule, and the stakes that
  // make saving in front of it matter. exitBattle -> applyWorldState clears it.
  if (b.legend) {
    play.legends[b.speciesId] = "beaten";
    lines.push("THE SEA FALLS QUIET.", "IT WILL NOT RISE AGAIN.");
  }
  savePlay();
  queueText(lines, exitBattle);
}

function foeAttack() {
  const b = game.battle;
  const label = (b.trainer ? "" : "WILD ") + nameOf(b.foe);
  if (b.foe.status === "SLP") {
    b.foe.slp = (b.foe.slp || 1) - 1;
    if (b.foe.slp > 0) {
      queueText([label + " IS FAST ASLEEP!"], () => { b.phase = "menu"; });
      return;
    }
    b.foe.status = null;
    // The waking turn is still lost, Gen 1's rule.
    queueText([label + " WOKE UP!"], () => { b.phase = "menu"; });
    return;
  }
  if (b.foe.status === "PAR" && Math.random() < 0.25) {
    queueText([label + " IS PARALYZED!", "IT CAN'T MOVE!"], () => { b.phase = "menu"; });
    return;
  }
  // Don't waste a pure status move on a hero who is already afflicted, or a
  // heal at full HP — pick from the damaging moves instead when there are any.
  let pool = b.foe.moves;
  const wasteful = (s) => (b.hero.status && !MOVES[s.id].power) ||
                          (MOVES[s.id].heal && b.foe.hp >= maxHpOf(b.foe));
  if (pool.some(wasteful)) {
    const useful = pool.filter(s => !wasteful(s));
    if (useful.length) pool = useful;
  }
  const slot = pool[Math.floor(Math.random() * pool.length)];
  const move = MOVES[slot.id];
  const mult = effectiveness(move.type, typeOf(b.hero));
  const dmg = move.power > 0
    ? damageCalc(b.foe.lvl, move.power, battleAtkOf(b.foe), defOf(b.hero), mult)
    : 0;
  b.hero.hp = Math.max(0, b.hero.hp - dmg);
  const lines = [label + " USED " + move.name + "!"];
  if (dmg > 0) {
    const eff = effectLine(mult);
    if (eff) lines.push(eff);
    b.flash = 6;
    SFX.hit();
  }
  if (move.heal) {
    const fmax = maxHpOf(b.foe);
    const amt = Math.min(fmax - b.foe.hp, Math.floor(fmax * move.heal));
    if (amt > 0) {
      b.foe.hp += amt;
      lines.push(label + " PATCHED UP " + amt + " HP!");
    } else {
      lines.push("BUT IT FAILED!");
    }
  }
  if (move.effect) {
    if (b.hero.hp > 0 && applyStatus(b.hero, Math.random() < move.effect.chance ? move.effect.status : null)) {
      lines.push(nameOf(b.hero) + " IS " + STATUS_LABEL[move.effect.status] + "!");
    } else if (!move.power) {
      lines.push("BUT IT FAILED!");
    }
  }
  lines.push(...statusChip(b.foe, label));
  savePlay();
  queueText(lines, () => {
    if (b.hero.hp <= 0) { heroDowned(); return; }
    if (b.foe.hp <= 0) { foeFainted(); return; }
    b.phase = "menu";
  });
}

// A downed hero: party wipe sends you back to the Sunny; otherwise auto-send
// the next able fighter rather than forcing a menu on a KO — fewer keystrokes
// at the least fun moment. Fainting clears the ailment, like the originals.
function heroDowned() {
  const b = game.battle;
  b.hero.status = null;
  b.hero.slp = 0;
  savePlay();
  const downed = nameOf(b.hero) + " IS OUT OF IT!";
  if (partyWiped()) {
    queueText([downed, "YOU SCRAMBLE BACK TO THE SUNNY..."], blackout);
  } else {
    const next = activeFighter();
    b.hero = next;
    b.heroHpShown = next.hp;
    queueText([downed, "GO, " + nameOf(next) + "!"], () => { b.phase = "menu"; });
  }
}

// Using a bag item always costs the turn, so items are a real trade-off.
function useItem(id) {
  const b = game.battle;
  const item = ITEMS[id];
  if (!item || itemCount(id) <= 0) { b.phase = "menu"; return; }
  if (item.kind === "ball") { tryCatch(); return; }
  if (item.kind === "heal") {
    const max = maxHpOf(b.hero);
    if (b.hero.hp >= max) {
      queueText([nameOf(b.hero) + " IS ALREADY FULL."], () => { b.phase = "menu"; });
      return;
    }
    takeItem(id);
    const healed = Math.min(item.amount, max - b.hero.hp);
    b.hero.hp += healed;
    savePlay();
    SFX.ok();
    queueText(["USED " + item.name + ".",
               nameOf(b.hero) + " RECOVERED " + healed + " HP!"], foeAttack);
    return;
  }
  if (item.kind === "cure") {
    if (!b.hero.status) {
      queueText([nameOf(b.hero) + " IS FINE ALREADY."], () => { b.phase = "menu"; });
      return;
    }
    takeItem(id);
    const was = STATUS_LABEL[b.hero.status];
    b.hero.status = null;
    b.hero.slp = 0;
    savePlay();
    SFX.ok();
    queueText(["USED " + item.name + ".",
               nameOf(b.hero) + " IS NO LONGER " + was + "!"], foeAttack);
    return;
  }
  b.phase = "menu";
}

function tryCatch() {
  const b = game.battle;
  if (b.trainer) {
    queueText(["YOU CAN'T CAGE ANOTHER TRAINER'S BEAST!"],
              () => { b.phase = "menu"; });
    return;
  }
  if (itemCount("cage") <= 0) {
    queueText(["NO SEA CAGES LEFT!", "THE SUNNY RESTOCKS THEM."],
              () => { b.phase = "menu"; });
    return;
  }
  takeItem("cage");
  const odds = catchOdds(b.foe);
  if (Math.random() < odds) {
    const caught = b.foe;
    const toBox = play.party.length >= PARTY_MAX;
    if (toBox) play.box.push(caught); else play.party.push(caught);
    play.caught[b.speciesId] = (play.caught[b.speciesId] || 0) + 1;
    if (b.legend) play.legends[b.speciesId] = "caught";
    savePlay();
    SFX.caught();
    const lines = ["YOU THREW A SEA CAGE!",
                   "GOTCHA! " + nameOf(caught) + " WAS CAUGHT!"];
    if (toBox) lines.push("YOUR CREW IS FULL - SENT TO THE BOX.");
    queueText(lines, exitBattle);
  } else {
    queueText(["YOU THREW A SEA CAGE!", "IT SHOOK... AND BROKE FREE!"], foeAttack);
  }
}

function doSwap(idx) {
  const b = game.battle;
  const pick = play.party[idx];
  if (!pick) { b.phase = "menu"; return; }
  if (pick === b.hero) {
    queueText([nameOf(pick) + " IS ALREADY OUT!"], () => { b.phase = "menu"; });
    return;
  }
  if (isFainted(pick)) {
    queueText([nameOf(pick) + " IS IN NO SHAPE TO FIGHT!"], () => { b.phase = "menu"; });
    return;
  }
  b.hero = pick;
  b.heroHpShown = pick.hp;
  // Switching costs the turn, same as the originals — otherwise swapping is
  // free and every fight becomes a type-matchup solitaire.
  queueText(["COME BACK!", "GO, " + nameOf(pick) + "!"], foeAttack);
}

function exitBattle() {
  game.battle = null;
  clearPressed();
  savePlay();
  // A trainer win can open a gate OR recruit a crew member, so rebuild the
  // whole world — populateNpcs() covers the town's crew NPCs and calls
  // applyWorldState() for everything else. Using applyWorldState() alone here
  // would leave a just-beaten crew member still standing as a challenger.
  populateNpcs();
  if (openNextEvo()) return;
  if (openNextLearn()) return;
  game.mode = MODE.WORLD;
}

// ---- evolution --------------------------------------------------------------
//
// The mechanic, deliberately without the lore: the animation is the classic
// flicker between the two forms, accelerating, then the swap. Whether this ends
// up being framed as gear, a time skip or something else is a naming decision
// that can be made later without touching any of this.
const EVO_FRAMES = 132;

function openNextEvo() {
  const queue = game.pendingEvos || [];
  while (queue.length) {
    const next = queue.shift();
    if (!next.f || !SPECIES[next.to] || next.f.id === next.to) continue;
    game.evo = { f: next.f, from: next.f.id, to: next.to, t: 0, cancelled: false };
    game.mode = MODE.EVOLVE;
    clearPressed();
    return true;
  }
  return false;
}

function finishEvo() {
  const e = game.evo;
  game.evo = null;
  if (!e) return;
  if (e.cancelled) {
    say([nameOf(e.f) + " STOPPED EVOLVING."], afterEvo);
    return;
  }
  const wasCalled = nameOf(e.f);
  e.f.id = e.to;
  // Learnset moves the new form already qualifies for, if there is room. A full
  // moveset queues the same replacement prompt a level-up would.
  for (const [lv, id] of speciesOf(e.f).learnset || []) {
    if (lv > e.f.lvl || e.f.moves.some(m => m.id === id)) continue;
    if (e.f.moves.length < MOVE_MAX) e.f.moves.push({ id: id, pp: MOVES[id].pp });
    else (game.pendingLearns = game.pendingLearns || []).push({ f: e.f, id: id });
  }
  e.f.hp = Math.min(e.f.hp, maxHpOf(e.f));
  savePlay();
  SFX.caught();
  say([wasCalled + " EVOLVED INTO " + nameOf(e.f) + "!"], afterEvo);
}

function afterEvo() {
  if (openNextEvo()) return;
  if (openNextLearn()) return;
  game.mode = MODE.WORLD;
}

function drawEvolve() {
  const e = game.evo;
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  // Flicker rate accelerates as it goes: slow swaps at the start, a blur by the
  // end. That ramp is what makes it read as a transformation and not a glitch.
  const progress = e.t / EVO_FRAMES;
  const period = Math.max(2, Math.round(14 - progress * 12));
  const showNew = Math.floor(e.t / period) % 2 === 1;
  const key = showNew ? SPECIES[e.to].sprite : SPECIES[e.from].sprite;
  const sprite = SPRITES[key];
  if (sprite) ctx.drawImage(sprite, (W - BIG) / 2, 64);
  const label = "WHAT?";
  drawText(label, textX(label, 2), 8, DARK, 2);
  drawText("B TO STOP IT", textX("B TO STOP IT", 1), 150, DARK);
}

// ---- move replacement UI ----------------------------------------------------

function openNextLearn() {
  const queue = game.pendingLearns || [];
  while (queue.length) {
    const next = queue.shift();
    // Skip anything that stopped being true while the queue waited — the
    // fighter may have learned it another way, or already have room.
    if (!next.f || !MOVES[next.id]) continue;
    if (next.f.moves.some(m => m.id === next.id)) continue;
    if (next.f.moves.length < MOVE_MAX) {
      next.f.moves.push({ id: next.id, pp: MOVES[next.id].pp });
      savePlay();
      continue;
    }
    game.learn = { f: next.f, id: next.id, idx: 0 };
    game.mode = MODE.LEARN;
    clearPressed();
    return true;
  }
  return false;
}

function resolveLearn(slot) {
  const L = game.learn;
  if (!L) return;
  if (slot >= 0 && slot < L.f.moves.length) {
    const forgotten = MOVES[L.f.moves[slot].id].name;
    L.f.moves[slot] = { id: L.id, pp: MOVES[L.id].pp };
    savePlay();
    SFX.level();
    game.learn = null;
    say([nameOf(L.f) + " FORGOT " + forgotten + ".",
         "AND LEARNED " + MOVES[L.id].name + "!"], () => {
      if (!openNextLearn()) game.mode = MODE.WORLD;
    });
    return;
  }
  game.learn = null;
  say([nameOf(L.f) + " DID NOT LEARN " + MOVES[L.id].name + "."], () => {
    if (!openNextLearn()) game.mode = MODE.WORLD;
  });
}

function drawLearn() {
  const L = game.learn;
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  frame(0, 0, W, 30);
  drawText(nameOf(L.f).slice(0, 16) + " WANTS", 6, 5, DARK);
  drawText("TO LEARN " + MOVES[L.id].name.slice(0, 14), 6, 16, DARK);

  frame(0, 32, W, H - 64);
  drawText("FORGET WHICH MOVE?", 6, 36, DARK);
  L.f.moves.forEach((m, i) => {
    const y = 50 + i * 13;
    if (i === L.idx) drawText(">", 4, y, DARK);
    drawText(MOVES[m.id].name.slice(0, 17), 12, y, DARK);
    drawText("PP" + m.pp, 130, y, DARK);
  });
  const giveUpY = 50 + L.f.moves.length * 13;
  if (L.idx === L.f.moves.length) drawText(">", 4, giveUpY, DARK);
  drawText("DON'T LEARN IT", 12, giveUpY, DARK);

  frame(0, H - 18, W, 18);
  const cur = L.idx < L.f.moves.length ? MOVES[L.f.moves[L.idx].id] : MOVES[L.id];
  drawText(cur.type + "  PWR " + cur.power, 6, H - 13, DARK);
}

function blackout() {
  play.battlesLost++;
  healParty();
  exitBattle();
  loadMap("sunny", 4, 5, "down");
}

function tryRun() {
  const b = game.battle;
  // Flat odds; the real games weighted this by speed.
  if (Math.random() < 0.7) {
    play.escapes++;
    savePlay();
    queueText(["GOT AWAY SAFELY!"], exitBattle);
  } else {
    queueText(["COULDN'T ESCAPE!"], foeAttack);
  }
}

function battleTick() {
  const b = game.battle;
  if (b.flash > 0) b.flash--;
  if (b.entry > 0) { b.entry--; return; }   // hold input during the entry wipe
  // HP bars slide toward the real value so a hit reads as a hit.
  b.heroHpShown += Math.sign(b.hero.hp - b.heroHpShown) * Math.max(0.4, Math.abs(b.hero.hp - b.heroHpShown) / 8);
  b.foeHpShown += Math.sign(b.foe.hp - b.foeHpShown) * Math.max(0.4, Math.abs(b.foe.hp - b.foeHpShown) / 8);
  if (Math.abs(b.heroHpShown - b.hero.hp) < 0.5) b.heroHpShown = b.hero.hp;
  if (Math.abs(b.foeHpShown - b.foe.hp) < 0.5) b.foeHpShown = b.foe.hp;

  if (b.phase === "text") {
    if (b.text.chars < (b.text.pages[b.text.page] || []).join("\n").length) {
      if (b.text.chars % 8 === 0) SFX.text();
      b.text.chars += 2;
    }
    if (took("a") || took("b")) { SFX.cursor(); battleAdvanceText(); }
    return;
  }
  if (b.phase === "menu") {
    // 2x2: up/down moves a row, left/right moves a column.
    if (took("up") || took("down")) { b.menu = (b.menu + 2) % 4; SFX.cursor(); }
    if (took("left") || took("right")) {
      b.menu = b.menu % 2 === 0 ? b.menu + 1 : b.menu - 1;
      SFX.cursor();
    }
    if (took("a")) {
      SFX.ok();
      const choice = BATTLE_MENU[b.menu];
      if (choice === "FIGHT") { b.phase = "moves"; b.moveIdx = 0; }
      else if (choice === "SWAP") { b.phase = "swap"; b.swapIdx = 0; }
      else if (choice === "BAG") {
        if (!bagIds().length) {
          queueText(["THE BAG IS EMPTY."], () => { b.phase = "menu"; });
        } else { b.phase = "bag"; b.bagIdx = 0; }
      }
      else if (b.trainer) {
        // Gen 1's rule, and it is what gives a trainer fight stakes.
        queueText(["NO RUNNING FROM A TRAINER!"], () => { b.phase = "menu"; });
      }
      else tryRun();
    }
    return;
  }
  if (b.phase === "moves") {
    const n = b.hero.moves.length;
