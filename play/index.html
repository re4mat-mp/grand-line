    if (took("up")) b.moveIdx = (b.moveIdx + n - 1) % n;
    if (took("down")) b.moveIdx = (b.moveIdx + 1) % n;
    if (took("b")) { b.phase = "menu"; return; }
    if (took("a")) heroAttack(b.moveIdx);
    return;
  }
  if (b.phase === "bag") {
    const ids = bagIds();
    if (!ids.length) { b.phase = "menu"; return; }
    if (took("up")) { b.bagIdx = (b.bagIdx + ids.length - 1) % ids.length; SFX.cursor(); }
    if (took("down")) { b.bagIdx = (b.bagIdx + 1) % ids.length; SFX.cursor(); }
    if (took("b")) { b.phase = "menu"; return; }
    if (took("a")) { SFX.ok(); useItem(ids[b.bagIdx]); }
    return;
  }
  if (b.phase === "swap") {
    const n = play.party.length;
    if (took("up")) b.swapIdx = (b.swapIdx + n - 1) % n;
    if (took("down")) b.swapIdx = (b.swapIdx + 1) % n;
    if (took("b")) { b.phase = "menu"; return; }
    if (took("a")) doSwap(b.swapIdx);
    return;
  }
}

// ---------------------------------------------------------------- drawing

const screen = document.getElementById("screen");
const sctx = screen.getContext("2d");
const buf = makeCanvas(W, H);
const ctx = buf.getContext("2d");

function px(color) { return UI_PAL[color]; }

function drawText(text, x, y, color, scale) {
  const s = scale || 1;
  let cx = x, cy = y;
  ctx.fillStyle = px(color === undefined ? DARK : color);
  for (const raw of String(text)) {
    if (raw === "\n") { cx = x; cy += LINE_H * s; continue; }
    const ch = raw.toUpperCase();
    const glyph = FONT[ch] || FONT["?"];
    const rows = glyph.split(",");
    for (let ry = 0; ry < rows.length; ry++) {
      const row = rows[ry];
      for (let rx = 0; rx < row.length; rx++) {
        if (row[rx] === "1") ctx.fillRect(cx + rx * s, cy + ry * s, s, s);
      }
    }
    cx += ADVANCE * s;
  }
}

// Centre a string of a given scale in the 160px width.
function textX(text, scale) {
  return Math.round((W - text.length * ADVANCE * (scale || 1)) / 2);
}

function frame(x, y, w, h) {
  // The classic textbox: light fill, dark 1px border, 1px inner gap.
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = px(DARK);
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h);
  ctx.fillRect(x + w - 1, y, 1, h);
  ctx.fillRect(x + 2, y + 2, w - 4, 1);
  ctx.fillRect(x + 2, y + h - 3, w - 4, 1);
  ctx.fillRect(x + 2, y + 2, 1, h - 4);
  ctx.fillRect(x + w - 3, y + 2, 1, h - 4);
}

function drawMap() {
  const map = game.map;
  const camX = game.cam.x, camY = game.cam.y;
  const x0 = Math.floor(camX / BLK), y0 = Math.floor(camY / BLK);
  for (let by = y0; by <= y0 + VIEW_H; by++) {
    for (let bx = x0; bx <= x0 + VIEW_W; bx++) {
      const b = blockAt(map, bx, by);
      const sx = bx * BLK - camX, sy = by * BLK - camY;
      if (!b) {
        // Off-map reads as water so the edge of the world isn't a black void.
        const w = BLOCKS[map.void || "w"];   // coasts drown, buildings wall off
        ctx.drawImage(w.frames[Math.floor(game.frame / 12) % w.frames.length], sx, sy);
        continue;
      }
      const f = b.animated ? Math.floor(game.frame / 12) % b.frames.length : 0;
      ctx.drawImage(b.frames[f], sx, sy);
    }
  }
}

function playerSprite() {
  const p = game.player;
  const f = p.walking ? p.animFrame : 0;
  if (p.dir === "down") return SPRITES["luffy_down_" + f];
  if (p.dir === "up") return SPRITES["luffy_up_" + f];
  if (p.dir === "right") return SPRITES["luffy_side_" + f];
  return SPRITES["luffy_left_" + f];
}

function drawWorld() {
  drawMap();
  const camX = game.cam.x, camY = game.cam.y;
  // DS-era depth cue: a soft shadow under everyone. Alpha instead of a
  // palette index on purpose — the first deliberate break from 4-colour
  // purity, and what makes sprites sit ON the ground instead of floating.
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = px(DARK);
  for (const npc of game.map.npcs || []) {
    ctx.beginPath();
    ctx.ellipse(npc.x * BLK - camX + 8, npc.y * BLK - camY + 14, 6, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.ellipse(Math.round(game.player.x * BLK + game.player.dx - camX) + 8,
              Math.round(game.player.y * BLK + game.player.dy - camY) + 14, 6, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  for (const npc of game.map.npcs || []) {
    const spr = SPRITES[npc.sprite];
    ctx.drawImage(spr, npc.x * BLK - camX, npc.y * BLK - camY - (spr.height - BLK));
  }
  const p = game.player;
  const pspr = playerSprite();
  ctx.drawImage(pspr,
    Math.round(p.x * BLK + p.dx - camX),
    Math.round(p.y * BLK + p.dy - camY) - (pspr.height - BLK));

  // The alert bubble. Drawn after the sprites so it always sits on top.
  if (game.sighting && game.sighting.phase === "alert") {
    const n = game.sighting.npc;
    const bx = n.x * BLK - camX + 4, by = n.y * BLK - camY - 14;
    ctx.fillStyle = px(PAPER);
    ctx.fillRect(bx, by, 10, 13);
    ctx.fillStyle = px(DARK);
    ctx.fillRect(bx, by, 10, 1);
    ctx.fillRect(bx, by + 12, 10, 1);
    ctx.fillRect(bx, by, 1, 13);
    ctx.fillRect(bx + 9, by, 1, 13);
    ctx.fillRect(bx + 4, by + 3, 2, 5);   // the bar of the !
    ctx.fillRect(bx + 4, by + 9, 2, 2);   // its dot
  }

  if (game.mode === MODE.TEXT) {
    frame(0, H - 48, W, 48);
    const full = currentPageText();
    const shown = full.slice(0, game.text.chars);
    drawText(shown, 8, H - 48 + 8, DARK);
    if (game.text.chars >= full.length) {
      // Blinking "more" arrow, bottom-right of the box.
      if (Math.floor(game.frame / 16) % 2 === 0) drawText("\x01", W - 14, H - 14, DARK);
    }
  }

  if (game.fadeFrames > 0) {
    // Cheap scanline wipe on map change — no alpha, so it stays 4-colour.
    const step = Math.ceil(game.fadeFrames / 2);
    ctx.fillStyle = px(DARK);
    for (let y = 0; y < H; y++) if (y % step === 0) ctx.fillRect(0, y, W, 1);
  }
}

// dbg=1 overlays live state on the frame. Exists because this engine's
// failures are silent by construction — no error, no warning, just a flow that
// quietly does nothing — and reasoning about which branch ran has been wrong
// every time. Draws what the code actually sees, not what it should see.
function drawDebug() {
  const map = game.map;
  const [vx, vy] = DIR_VEC[game.player.dir];
  const facing = npcAt(map, game.player.x + vx, game.player.y + vy);
  const rec = Object.keys(play.recruited || {}).join(",") || "-";
  const lines = [
    "MODE " + game.mode + " PARTY " + play.party.length,
    "FACE " + (facing ? (facing.recruit ? "RECRUIT " + facing.recruit.name
                                        : facing.trainer ? "TRAINER" : "PLAIN")
                      : "NONE"),
    "RECRUITED " + rec,
    "Q " + (Object.entries(play.quests).map(([k, v]) => k + ":" + v).join(" ") || "-"),
    "P " + play.party.map(f => nameOf(f).slice(0, 5) + f.lvl).join(" "),
    "T " + (Object.keys(play.trainers || {}).join(",") || "-") +
      " DUEL" + (TRAINERS.zoro_duel ? "1" : "0"),
  ];
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, 42);
  lines.forEach((l, i) => drawText(l.slice(0, 26), 2, 1 + i * 8, DARK));
}

function hpBar(x, y, w, cur, max) {
  const pct = max > 0 ? Math.max(0, Math.min(1, cur / max)) : 0;
  ctx.fillStyle = px(DARK);
  ctx.fillRect(x, y, w, 5);
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(x + 1, y + 1, w - 2, 3);
  const fill = Math.round((w - 2) * pct);
  // Green / yellow / red, now that there is colour to spend. On the DMG palette
  // this had to be a lightness change instead, which was always the weaker cue.
  ctx.fillStyle = pct > 0.5 ? "#4fae43" : pct > 0.25 ? "#d8b83a" : "#c03a2a";
  if (fill > 0) ctx.fillRect(x + 1, y + 1, fill, 3);
}

function drawBattle() {
  const b = game.battle;
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);

  // Gen 2-style ground platforms instead of the old bare lines — the single
  // cheapest thing that stops the battle screen reading as text boxes floating
  // on cream. MID rim, LITE fill; positions match the 48x48 sprite feet.
  for (const [cx, cy, rx, ry] of [[196, 74, 34, 8], [60, 150, 36, 8]]) {
    ctx.fillStyle = px(MID);
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = px(LITE);
    ctx.beginPath(); ctx.ellipse(cx, cy - 1, rx - 2, ry - 2, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Idle bob, and a shake on the frame a hit lands — the two cheapest things
  // that stop a battle screen looking like a still image.
  const bob = Math.floor(game.frame / 24) % 2;
  const shake = b.flash > 0 ? (b.flash % 2 ? 1 : -1) * 2 : 0;

  const foeSprite = SPRITES[frontSpriteOf(b.foe)];
  const foeHit = b.flash > 0 && b.phase === "text" && b.foe.hp < b.foeHpShown;
  // Blink the struck sprite off every other pair of frames, like the originals.
  if (!(foeHit && b.flash % 4 < 2)) {
    ctx.drawImage(foeSprite, 172 + (foeHit ? shake : 0), 28 + bob);
  }
  const heroHit = b.flash > 0 && b.phase === "text" && b.hero.hp < b.heroHpShown;
  if (!(heroHit && b.flash % 4 < 2)) {
    ctx.drawImage(SPRITES[backSpriteOf(b.hero)], 36 + (heroHit ? shake : 0), 104 - bob);
  }

  // Foe status box, top-left.
  frame(4, 8, 96, 26);
  // 14, and the box widened to match: the longest species name is "KUNG-FU
  // DUGONG" at 14, and every narrower version of this clipped a real name
  // ("DEN DEN MUSH", "KUNG-FU DUGON"). 14 glyphs from x=9 end at 93, inside the
  // 96-wide box, which itself stops at 100 against the sprite at 102.
  // An ailment steals the name row's right end: name drops to 10 glyphs (ends
  // x=69) and the 3-glyph tag sits at 75..93, still inside the box.
  drawText(nameOf(b.foe).slice(0, b.foe.status ? 10 : 14), 9, 13, DARK);
  if (b.foe.status) drawText(b.foe.status, 75, 13, DARK);
  drawText(":L" + b.foe.lvl, 9, 22, DARK);
  hpBar(44, 24, 46, b.foeHpShown, maxHpOf(b.foe));

  // Hero status box, bottom-right. Taller than the foe's because it also carries
  // the HP numbers — at 30px the "35/35" line sat on top of the bottom border.
  frame(148, 100, 100, 44);
  drawText(nameOf(b.hero).slice(0, b.hero.status ? 10 : 14), 154, 105, DARK);
  if (b.hero.status) drawText(b.hero.status, 224, 105, DARK);
  drawText(":L" + b.hero.lvl, 154, 117, DARK);
  hpBar(186, 118, 56, b.heroHpShown, maxHpOf(b.hero));
  drawText(Math.ceil(b.heroHpShown) + "/" + maxHpOf(b.hero), 176, 130, DARK);

  if (b.phase === "text") {
    frame(0, H - 48, W, 48);
    const full = (b.text.pages[b.text.page] || []).join("\n");
    drawText(full.slice(0, b.text.chars), 8, H - 40, DARK);
    if (b.text.chars >= full.length && Math.floor(game.frame / 16) % 2 === 0) {
      drawText("\x01", W - 14, H - 14, DARK);
    }
    return;
  }

  if (b.phase === "menu") {
    frame(0, H - 48, W - 76, 48);
    drawText(nameOf(b.hero).slice(0, 11) + ":", 5, H - 40, DARK);
    drawText("WHAT NOW?", 5, H - 30, DARK);
    drawText("CAGES " + itemCount("cage"), 5, H - 18, DARK);
    // 2x2 grid, the classic layout: FIGHT CAGE / SWAP RUN.
    frame(W - 76, H - 48, 76, 48);
    BATTLE_MENU.forEach((label, i) => {
      const col = i % 2, row = (i / 2) | 0;
      drawText(label, W - 62 + col * 34, H - 38 + row * 14, DARK);
    });
    drawText(">", W - 70 + (b.menu % 2) * 34, H - 38 + ((b.menu / 2) | 0) * 14, DARK);
    return;
  }

  if (b.phase === "moves") {
    frame(0, H - 48, W, 48);
    const moves = movesOf(b.hero);
    moves.forEach((m, i) => {
      drawText(m.name.slice(0, 19), 14, H - 44 + i * 10, DARK);
      drawText("PP" + m.ppLeft, 128, H - 44 + i * 10, DARK);
    });
    drawText(">", 5, H - 44 + b.moveIdx * 10, DARK);
    const cur = moves[b.moveIdx];
    // A move with no power prints what it DOES instead. Every branch is needed:
    // reading cur.effect.status unconditionally crashes on a heal move, which
    // has neither power nor effect.
    if (cur) {
      const tag = cur.power ? "PWR " + cur.power
                : cur.heal ? "HEAL " + Math.round(cur.heal * 100) + "%"
                : cur.effect ? STATUS_LABEL[cur.effect.status]
                : "-";
      drawText(cur.type + "  " + tag, 14, H - 12, DARK);
    }
    return;
  }

  if (b.entry > 0) {
    // Scanline wipe, thinning out as it goes. No alpha — staying inside the
    // four colours matters more than a smooth fade.
    const step = Math.max(1, Math.ceil(b.entry / 2));
    ctx.fillStyle = px(DARK);
    for (let y = 0; y < H; y++) if (y % step === 0) ctx.fillRect(0, y, W, 1);
    return;
  }

  if (b.phase === "bag") {
    frame(0, H - 48, W, 48);
    const ids = bagIds();
    const first = Math.max(0, Math.min(b.bagIdx - 1, ids.length - 3));
    for (let r = 0; r < Math.min(3, ids.length); r++) {
      const i = first + r;
      const id = ids[i];
      if (!id) continue;
      const y = H - 44 + r * 11;
      if (i === b.bagIdx) drawText(">", 5, y, DARK);
      drawText(ITEMS[id].name.slice(0, 14), 14, y, DARK);
      drawText("x" + itemCount(id), 128, y, DARK);
    }
    return;
  }

  if (b.phase === "swap") {
    frame(0, H - 48, W, 48);
    // Six party slots won't fit in a 48px box, so the list scrolls around the
    // cursor — three rows at a time.
    const n = play.party.length;
    const first = Math.max(0, Math.min(b.swapIdx - 1, n - 3));
    for (let row = 0; row < Math.min(3, n); row++) {
      const i = first + row;
      const f = play.party[i];
      if (!f) continue;
      const y = H - 44 + row * 11;
      drawText(nameOf(f).slice(0, 13), 14, y, DARK);
      drawText("L" + f.lvl, 106, y, DARK);
      drawText(isFainted(f) ? "OUT" : f.hp + "/" + maxHpOf(f), 124, y, DARK);
      if (i === b.swapIdx) drawText(">", 5, y, DARK);
    }
  }
}

// The voyage log. Its layout IS the two-ledger rule: play on top, real work
// below, labelled read-only, and the footer says out loud that one never moves
// the other. Cheaper and more honest than trusting everyone to remember.
function drawLog() {
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);

  frame(0, 0, W, 16);
  drawText(game.logPage === 0 ? "VOYAGE LOG" : "YOUR PARTY", 6, 5, DARK);
  drawText("\x03 X \x04", W - 34, 5, DARK);

  if (game.logPage === 0) {
    frame(0, 18, W, 52);
    drawText("PLAY - RECREATIONAL", 6, 22, DARK);
    // Three short lines beat two long ones: at 6px a glyph, anything past ~24
    // characters runs off the right edge, which is how "BADGES" got clipped.
    drawText("WON " + play.battlesWon + "  FLED " + play.escapes +
             "  LOST " + play.battlesLost, 6, 34, DARK);
    drawText("BEASTS " + speciesCount(play.beaten) +
             "  CAUGHT " + speciesCount(play.caught), 6, 45, DARK);
    drawText("BADGES " + badgeCount() + "  STEPS " + play.steps, 6, 56, DARK);

    frame(0, 72, W, 52);
    drawText("CREW - REAL WORK", 6, 76, DARK);
    if (ROUTE) {
      drawText("CREW XP " + commas(ROUTE.total_crew_xp), 6, 88, DARK);
      drawText("PORT: " + String(ROUTE.at_island || "AT SEA").toUpperCase(), 6, 99, DARK);
      const next = ROUTE.next_island;
      drawText(next
        ? "NEXT: " + next.name.toUpperCase() + " " + commas(next.xp_away)
        : "WHOLE ROUTE CLEARED", 6, 110, DARK);
    } else {
      drawText("NO CREW LOG LOADED.", 6, 90, DARK);
      drawText("LAUNCH FROM CLAUDE+.", 6, 101, DARK);
    }

    frame(0, H - 18, W, 18);
    drawText("PLAY NEVER MOVES CREW XP", 6, H - 13, DARK);
    return;
  }

  // Page 2: the party — the game's own progression, on the game's own curve.
  frame(0, 18, W, 106);
  play.party.forEach((f, i) => {
    const y = 23 + i * 16;
    drawText(nameOf(f).slice(0, 13), 6, y, DARK);
    drawText("L" + f.lvl, 92, y, DARK);
    drawText(isFainted(f) ? "OUT" : f.hp + "/" + maxHpOf(f), 112, y, DARK);
    hpBar(92, y + 8, 60, f.hp, maxHpOf(f));
    // XP to the next level, so the play curve is legible as a curve.
    const need = xpToReach(f.lvl + 1) - f.xp;
    drawText("NEXT " + Math.max(0, need), 6, y + 8, DARK);
  });
  if (!play.party.length) drawText("NOBODY WITH YOU.", 6, 24, DARK);

  frame(0, H - 18, W, 18);
  // Kept short on purpose: at 6px per glyph anything past ~24 characters runs
  // off the right edge, which is how the first version of this line shipped.
  drawText(berryShort(play.belly) + "   CAGE " + itemCount("cage"), 6, H - 13, DARK);
}

// Debug-only view, reachable solely through #screen=sheet. Nine 16x16
// silhouettes are the kind of thing you cannot judge scattered across a map at
// their own scale — side by side, a head that fails to read is obvious.
function drawSpriteSheet() {
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  Object.keys(NPC_HEADS).forEach((k, i) => {
    const x = 8 + (i % 5) * 30, y = 10 + ((i / 5) | 0) * 46;
    ctx.drawImage(SPRITES["npc_" + k], x, y);
    drawText(k.slice(0, 4), x - 2, y + 28, DARK);
  });
  drawText("PLAYER", 8, H - 26, DARK);
  ctx.drawImage(SPRITES.luffy_down_0, 52, H - 30);
  ctx.drawImage(SPRITES.marine, 74, H - 30);
}

// The travel screen. This is the one place the two ledgers meet by design: the
// list is the real Grand Line route, an island you have not reached with real
// work cannot be sailed to, and nothing you do in the game can unlock one.
function drawTravel() {
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  frame(0, 0, W, 16);
  drawText("SET COURSE", 6, 5, DARK);
  drawText("X BACK", W - 44, 5, DARK);

  const opts = travelOptions();
  frame(0, 18, W, H - 66);
  if (!opts.length) {
    drawText("NO CREW LOG LOADED.", 6, 24, DARK);
    drawText("NO ROUTE TO SAIL.", 6, 34, DARK);
  } else {
    // Six rows at a time, scrolled around the cursor — the route is 16 stops.
    const rows = 7;
    const first = Math.max(0, Math.min(game.travelIdx - 2, opts.length - rows));
    for (let r = 0; r < Math.min(rows, opts.length); r++) {
      const i = first + r;
      const o = opts[i];
      if (!o) continue;
      const y = 24 + r * 16;
      if (i === game.travelIdx) drawText(">", 2, y, DARK);
      drawText(o.name.toUpperCase().slice(0, 16), 10, y, DARK);
      // Right-aligned, and no " XP" suffix. Fixed columns collided both ways in
      // the first render: "REVERSE MOUNTAIN" (16 chars) ran into the status, and
      // "10,250 XP" ran off the right edge. The footer says what the number is.
      const status = o.lock ? "LOCKED" : o.dest ? "SAIL" : "NO PORT";
      drawText(status, (W - 6) - status.length * ADVANCE, y, DARK);
    }
  }

  frame(0, H - 18, W, 18);
  const cur = opts[game.travelIdx];
  drawText(cur && cur.lock ? "SOMETHING STILL BARS THE WAY"
         : cur && !cur.dest ? "NO PORT BUILT HERE YET"
                            : "PICK A PORT AND SAIL", 6, H - 13, DARK);
}

function drawTitle() {
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  // A horizon band, so the hat has something to sit against.
  ctx.fillStyle = px(LITE);
  ctx.fillRect(0, 84, W, 2);
  ctx.drawImage(SPRITES.title_hat, (W - BIG) / 2, 30);

  drawText("GRAND LINE", textX("GRAND LINE", 2), 92, DARK, 2);
  drawText("A CLAUDE+ VOYAGE", textX("A CLAUDE+ VOYAGE", 1), 118, DARK);

  if (Math.floor(game.frame / 24) % 2 === 0) {
    const __press = window.__touchUI ? "PRESS A" : "PRESS Z";
    drawText(__press, textX(__press, 1), 144, DARK);
  }
  if (ROUTE) {
    const line = "CREW XP " + commas(ROUTE.total_crew_xp);
    drawText(line, textX(line, 1), 166, DARK);
  }
}

function dismissTitle() {
  // The opening dialogue was already queued by boot(), so hand back to it if it
  // is still pending rather than dropping the player straight into the world.
  game.mode = game.text.pages.length ? MODE.TEXT : MODE.WORLD;
  clearPressed();
}

function shopList() { return game.shopTab === 1 ? bagIds() : SHOP_STOCK; }

function drawShop() {
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  frame(0, 0, W, 16);
  drawText("SHOP", 6, 5, DARK);
  // The tab indicator: left/right flips between buying and selling.
  const selling = game.shopTab === 1;
  drawText("\x03" + (selling ? "SELL" : "BUY") + "\x04", 40, 5, DARK);
  const money = berryShort(play.belly);
  drawText(money, W - 8 - money.length * ADVANCE, 5, DARK);

  // One line per item. The first version put a "HAVE n" line under each name at
  // +8 with rows every 16, so every count sat on top of the next item.
  const ids = shopList();
  frame(0, 18, W, 76);
  if (!ids.length) {
    drawText("NOTHING TO SELL.", 8, 26, DARK);
  }
  ids.forEach((id, i) => {
    const y = 26 + i * 16;
    if (i === game.shopIdx) drawText(">", 4, y, DARK);
    drawText(ITEMS[id].name.slice(0, 11), 12, y, DARK);
    drawText("x" + itemCount(id), 84, y, DARK);
    const price = berryShort(selling ? sellPrice(id) : ITEMS[id].price);
    drawText(price, 150 - price.length * ADVANCE, y, DARK);
  });

  frame(0, 96, W, H - 96);
  const cur = ITEMS[ids[game.shopIdx]];
  if (cur) {
    drawText(cur.kind === "ball" ? "CATCHES A WILD BEAST."
           : cur.kind === "cure" ? "CURES ANY AILMENT."
                                 : "RESTORES " + cur.amount + " HP.", 6, 102, DARK);
    if (selling) drawText("Z SELL   X LEAVE", 6, 116, DARK);
    else drawText(play.belly >= cur.price ? "Z BUY    X LEAVE"
                                          : "NOT ENOUGH BERRIES", 6, 116, DARK);
  } else {
    drawText("X LEAVE", 6, 116, DARK);
  }
  drawText(selling ? "HALF PRICE BUYBACK" : "TRAINERS PAY THE BILLS", 6, 128, DARK);
}

// GOAL sits first on purpose: the one thing a lost player needs is the top of
// the list, not buried under three inventory screens.
const MENU_ITEMS = ["GOAL", "PARTY", "BAG", "BOX", "LOG", "SAVE", "LOAD", "CLOSE"];

function drawMenu() {
  drawWorld();
  // A panel down the right, the way the originals did it — the world stays
  // visible behind, so opening the menu never loses your bearings.
  const w = 62, x = W - w, h = 12 + MENU_ITEMS.length * 12;
  frame(x, 4, w, h);
  MENU_ITEMS.forEach((label, i) => {
    const y = 10 + i * 12;
    if (i === game.menuIdx) drawText(">", x + 4, y, DARK);
    drawText(label, x + 12, y, DARK);
  });
}

function drawConfirm() {
  drawWorld();
  frame(0, H - 48, W, 48);
  const c = game.confirm;
  c.lines.slice(0, 2).forEach((l, i) => drawText(l, 8, H - 40 + i * 10, DARK));
  drawText("Z YES    X NO", 8, H - 16, DARK);
}

function healTargets() { return play.party; }

function drawPartyScreen() {
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  frame(0, 0, W, 16);
  drawText(game.useItem ? "USE ON WHO?" : "PARTY", 6, 5, DARK);
  drawText("X BACK", W - 44, 5, DARK);

  frame(0, 18, W, H - 48);
  play.party.forEach((f, i) => {
    const y = 24 + i * 19;
    if (i === game.partyIdx) drawText(">", 3, y, DARK);
    drawText(nameOf(f).slice(0, 13), 10, y, DARK);
    // Right-aligned HP: at a fixed x, "L12" and "38/38" collided into "L1238/38".
    drawText("L" + f.lvl, 92, y, DARK);
    const hp = isFainted(f) ? "OUT" : f.hp + "/" + maxHpOf(f);
    drawText(hp, 152 - hp.length * ADVANCE, y, DARK);
    // The ailment tag sits under the name, left of the bar at x=92.
    if (f.status) drawText(f.status, 10, y + 9, DARK);
    hpBar(92, y + 9, 60, f.hp, maxHpOf(f));
  });
  if (!play.party.length) drawText("NOBODY WITH YOU.", 8, 26, DARK);
}

function drawBagScreen() {
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  frame(0, 0, W, 16);
  drawText("BAG", 6, 5, DARK);
  const money = berryShort(play.belly);
  drawText(money, W - 8 - money.length * ADVANCE, 5, DARK);

  const ids = bagIds();
  frame(0, 18, W, H - 48);
  if (!ids.length) {
    drawText("THE BAG IS EMPTY.", 8, 26, DARK);
    return;
  }
  ids.forEach((id, i) => {
    const y = 26 + i * 14;
    if (i === game.bagIdx) drawText(">", 3, y, DARK);
    drawText(ITEMS[id].name.slice(0, 14), 10, y, DARK);
    drawText("x" + itemCount(id), 126, y, DARK);
  });
  const cur = ITEMS[ids[game.bagIdx]];
  if (cur) {
    drawText(cur.kind === "ball" ? "ONLY USABLE IN BATTLE."
           : cur.kind === "cure" ? "CURES ANY AILMENT."
                                 : "RESTORES " + cur.amount + " HP.", 8, 128, DARK);
  }
}

function drawBoxScreen() {
  ctx.fillStyle = px(PAPER);
  ctx.fillRect(0, 0, W, H);
  frame(0, 0, W, 16);
  drawText("BOX " + play.box.length, 6, 5, DARK);
  drawText("X BACK", W - 44, 5, DARK);

  frame(0, 18, W, H - 66);
  if (!play.box.length) {
    drawText("THE BOX IS EMPTY.", 8, 26, DARK);
  } else {
    const rows = 6;
    const first = Math.max(0, Math.min(game.boxIdx - 2, play.box.length - rows));
    for (let r = 0; r < Math.min(rows, play.box.length); r++) {
      const i = first + r;
      const f = play.box[i];
      if (!f) continue;
      const y = 24 + r * 16;
      if (i === game.boxIdx) drawText(">", 3, y, DARK);
      drawText(nameOf(f).slice(0, 14), 10, y, DARK);
      drawText("L" + f.lvl, 130, y, DARK);
    }
  }
  frame(0, H - 16, W, 16);
  drawText(play.party.length < PARTY_MAX ? "Z TAKE INTO THE CREW"
                                         : "CREW IS FULL", 6, H - 11, DARK);
}

function render() {
  if (game.mode === MODE.BOX) drawBoxScreen();
  else if (game.mode === MODE.MENU) drawMenu();
  else if (game.mode === MODE.PARTY) drawPartyScreen();
  else if (game.mode === MODE.BAG) drawBagScreen();
  else if (game.mode === MODE.EVOLVE && game.evo) drawEvolve();
  else if (game.mode === MODE.SHOP) drawShop();
  else if (game.mode === MODE.CONFIRM && game.confirm) drawConfirm();
  else if (game.mode === MODE.LEARN && game.learn) drawLearn();
  else if (game.mode === MODE.TITLE) drawTitle();
  else if (game.mode === MODE.TRAVEL) drawTravel();
  else if (game.mode === MODE.SHEET) drawSpriteSheet();
  else if (game.mode === MODE.LOG) drawLog();
  else if (game.mode === MODE.BATTLE && game.battle) drawBattle();
  else drawWorld();
  if (game.dbg) drawDebug();
  sctx.imageSmoothingEnabled = false;
  sctx.clearRect(0, 0, screen.width, screen.height);
  sctx.drawImage(buf, 0, 0, screen.width, screen.height);
}

// ---------------------------------------------------------------- loop

function tick() {
  game.frame++;
  if (game.fadeFrames > 0) game.fadeFrames--;
  if (took("mute")) {
    play.mute = !play.mute;
    savePlay();
    if (!play.mute) SFX.ok();
  }
  if (game.mode === MODE.CONFIRM && game.confirm) {
    if (took("a")) {
      const yes = game.confirm.yes;
      game.confirm = null;
      SFX.ok();
      yes();
      clearPressed();
    } else if (took("b")) {
      game.confirm = null;
      game.mode = MODE.WORLD;
      SFX.cursor();
      clearPressed();
    }
    return;
  }
  if (game.mode === MODE.MENU) {
    const n = MENU_ITEMS.length;
    if (took("up")) { game.menuIdx = (game.menuIdx + n - 1) % n; SFX.cursor(); }
    if (took("down")) { game.menuIdx = (game.menuIdx + 1) % n; SFX.cursor(); }
    if (took("b")) { game.mode = MODE.WORLD; clearPressed(); return; }
    if (took("a")) {
      SFX.ok();
      const pick = MENU_ITEMS[game.menuIdx];
      if (pick === "GOAL") say(["GOAL"].concat(mainGoal().lines));
      else if (pick === "PARTY") { game.partyIdx = 0; game.useItem = null; game.mode = MODE.PARTY; }
      else if (pick === "BAG") { game.bagIdx = 0; game.mode = MODE.BAG; }
      else if (pick === "BOX") { game.boxIdx = 0; game.mode = MODE.BOX; }
      else if (pick === "LOG") { game.logPage = 0; game.mode = MODE.LOG; }
      else if (pick === "SAVE") {
        say(writeSlot() ? ["PROGRESS SAVED.", "THE VOYAGE CAN ALWAYS RETURN HERE."]
                        : ["COULDN'T SAVE - STORAGE IS BLOCKED HERE."]);
      }
      else if (pick === "LOAD") {
        if (!readSlot()) say(["NO SAVED VOYAGE YET.", "USE SAVE FIRST."]);
        else askConfirm(["RETURN TO THE LAST SAVE?", "UNSAVED PROGRESS LOST."], () => {
          loadSlot();
          say(["BACK TO THE LAST SAVE."]);
        });
      }
      else game.mode = MODE.WORLD;
      clearPressed();
    }
    return;
  }
  if (game.mode === MODE.BOX) {
    const n = play.box.length;
    if (n) {
      if (took("up")) { game.boxIdx = (game.boxIdx + n - 1) % n; SFX.cursor(); }
      if (took("down")) { game.boxIdx = (game.boxIdx + 1) % n; SFX.cursor(); }
    }
    if (took("b")) { game.mode = MODE.MENU; clearPressed(); return; }
    if (took("a") && n) {
      if (play.party.length >= PARTY_MAX) { SFX.hit(); return; }
      const f = play.box.splice(game.boxIdx, 1)[0];
      play.party.push(f);
      game.boxIdx = Math.max(0, Math.min(game.boxIdx, play.box.length - 1));
      savePlay();
      SFX.ok();
      game.mode = MODE.WORLD;
      say([nameOf(f) + " JOINED THE CREW!"]);
      clearPressed();
    }
    return;
  }
  if (game.mode === MODE.BAG) {
    const ids = bagIds();
    if (took("up") && ids.length) { game.bagIdx = (game.bagIdx + ids.length - 1) % ids.length; SFX.cursor(); }
    if (took("down") && ids.length) { game.bagIdx = (game.bagIdx + 1) % ids.length; SFX.cursor(); }
    if (took("b")) { game.mode = MODE.MENU; clearPressed(); return; }
    if (took("a") && ids.length) {
      const id = ids[game.bagIdx];
      const kind = ITEMS[id].kind;
      if (kind === "heal" || kind === "cure") {
        // Hand off to the party screen to pick a target.
        game.useItem = id;
        game.partyIdx = 0;
        game.mode = MODE.PARTY;
        SFX.ok();
      } else {
        SFX.hit();
      }
      clearPressed();
    }
    return;
  }
  if (game.mode === MODE.PARTY) {
    const n = play.party.length;
    if (n) {
      if (took("up")) { game.partyIdx = (game.partyIdx + n - 1) % n; SFX.cursor(); }
      if (took("down")) { game.partyIdx = (game.partyIdx + 1) % n; SFX.cursor(); }
    }
    if (took("b")) {
      game.mode = game.useItem ? MODE.BAG : MODE.MENU;
      game.useItem = null;
      clearPressed();
      return;
    }
    if (took("a") && game.useItem && n) {
      const id = game.useItem;
      const f = play.party[game.partyIdx];
      if (ITEMS[id].kind === "cure") {
        if (!f.status) { SFX.hit(); return; }
        takeItem(id);
        const was = STATUS_LABEL[f.status];
        f.status = null;
        f.slp = 0;
        savePlay();
        SFX.level();
        game.useItem = null;
        game.mode = MODE.WORLD;
        say(["USED " + ITEMS[id].name + ".",
             nameOf(f) + " IS NO LONGER " + was + "!"]);
        clearPressed();
        return;
      }
      const max = maxHpOf(f);
      if (f.hp >= max) { SFX.hit(); return; }
      takeItem(id);
      const healed = Math.min(ITEMS[id].amount, max - f.hp);
      f.hp += healed;
      savePlay();
      SFX.level();
      game.useItem = null;
      game.mode = MODE.WORLD;
      say(["USED " + ITEMS[id].name + ".",
           nameOf(f) + " RECOVERED " + healed + " HP!"]);
      clearPressed();
    }
    return;
  }
  if (game.mode === MODE.EVOLVE && game.evo) {
    if (took("b")) game.evo.cancelled = true;
    game.evo.t++;
    if (game.evo.t % 18 === 0) SFX.cursor();
    if (game.evo.t >= EVO_FRAMES || game.evo.cancelled) finishEvo();
    return;
  }
  if (game.mode === MODE.SHOP) {
    if (took("left") || took("right")) {
      game.shopTab = 1 - (game.shopTab || 0);
      game.shopIdx = 0;
      SFX.cursor();
    }
    const ids = shopList();
    const n = ids.length;
    if (n) {
      if (took("up")) { game.shopIdx = (game.shopIdx + n - 1) % n; SFX.cursor(); }
      if (took("down")) { game.shopIdx = (game.shopIdx + 1) % n; SFX.cursor(); }
    }
    if (took("b")) { game.mode = MODE.WORLD; clearPressed(); return; }
    if (took("a") && n) {
      const id = ids[game.shopIdx];
      if (game.shopTab === 1) {
        play.belly += sellPrice(id);
        takeItem(id);
        // Selling the last of an item shortens the list under the cursor.
        game.shopIdx = Math.max(0, Math.min(game.shopIdx, shopList().length - 1));
        savePlay();
        SFX.ok();
        return;
      }
      const price = ITEMS[id].price;
      if (play.belly < price) { SFX.hit(); return; }
      play.belly -= price;
      giveItem(id, 1);
      SFX.ok();
    }
    return;
  }
  if (game.mode === MODE.LEARN && game.learn) {
    const n = game.learn.f.moves.length + 1;   // +1 for DON'T LEARN IT
    if (took("up")) { game.learn.idx = (game.learn.idx + n - 1) % n; SFX.cursor(); }
    if (took("down")) { game.learn.idx = (game.learn.idx + 1) % n; SFX.cursor(); }
    if (took("b")) { SFX.cursor(); resolveLearn(-1); }
    else if (took("a")) { SFX.ok(); resolveLearn(game.learn.idx); }
    return;
  }
  if (game.mode === MODE.TITLE) {
    if (took("a") || took("b")) dismissTitle();
    return;
  }
  if (game.mode === MODE.LOG) {
    if (took("left") || took("right")) game.logPage = 1 - game.logPage;
    if (took("b") || took("a")) { game.mode = MODE.WORLD; clearPressed(); }
    return;
  }
  if (game.mode === MODE.TRAVEL) {
    const opts = travelOptions();
    if (opts.length) {
      if (took("up")) game.travelIdx = (game.travelIdx + opts.length - 1) % opts.length;
      if (took("down")) game.travelIdx = (game.travelIdx + 1) % opts.length;
    }
    if (took("b")) { game.mode = MODE.WORLD; clearPressed(); return; }
    if (took("a")) {
      const pick = opts[game.travelIdx];
      game.mode = MODE.WORLD;
      clearPressed();
      if (!pick) return;
      if (pick.lock) {
        say(pick.lock.lines);
        return;
      }
      if (!pick.dest) {
        say([pick.name.toUpperCase() + " HAS NO PORT BUILT YET.",
             "SOMETHING TO ADD LATER."]);
      } else {
        say(["SETTING COURSE FOR " + pick.name.toUpperCase() + "."], () => {
          loadMap(pick.dest.map, pick.dest.x, pick.dest.y, pick.dest.dir);
        });
      }
    }
    return;
  }
  if (game.mode === MODE.BATTLE) { battleTick(); return; }
  if (game.mode === MODE.TEXT) {
    const full = currentPageText().length;
    if (game.text.chars < full) {
      if (game.text.chars % 8 === 0) SFX.text();
      game.text.chars += 2;
    }
    if (took("a") || took("b")) { SFX.cursor(); advanceText(); }
    return;
  }
  worldTick();
}

function resize() {
  const scale = Math.max(1, Math.min(
    Math.floor(window.innerWidth / W),
    Math.floor((window.innerHeight - 24) / H)));
  screen.width = W * scale;
  screen.height = H * scale;
  screen.style.width = (W * scale) + "px";
  screen.style.height = (H * scale) + "px";
  sctx.imageSmoothingEnabled = false;
  // Setting canvas.width clears it, so a resize must repaint in the same turn —
  // otherwise the window sits blank until the next frame, which off-screen (or
  // in any throttled webview) may never come. Guarded because boot() resizes
  // before the first map is loaded.
  if (game.map) render();
}
window.addEventListener("resize", resize);

// setInterval, NOT requestAnimationFrame. Same gotcha the dashboard hit and
// wrote down (see the body.anim-ready note in dashboard.template.html): in this
// WKWebView rAF can fire exactly once and never again, which for a dashboard
// costs one animation and for a game costs the entire game — measured here, with
// the opening line frozen two characters in and every keypress piling up
// unconsumed. An interval is less elegant and it actually runs.
const FRAME_MS = 1000 / 60;
let last = 0, acc = 0;
function loop() {
  const now = performance.now();
  if (!last) last = now;
  acc += now - last;
  last = now;
  // Clamp, so a throttled or backgrounded window doesn't fast-forward the world
  // in one burst when it comes back.
  if (acc > 200) acc = 200;
  let ran = 0;
  while (acc >= FRAME_MS && ran < 6) { tick(); acc -= FRAME_MS; ran++; }
  render();
}

// Snapshot hook. src/shot renders this page in a fully off-screen WKWebView,
// where BOTH rAF and setInterval are suspended — so "wait a few seconds and
// screenshot" can never see frame 2. This drives the world synchronously
// instead: every state is reachable in one deterministic, reproducible shot.
//   game.html#map=shells,x=6,y=6,ticks=90
//   game.html#screen=log
//   game.html#battle=menu
// Reads location.hash and nothing else, so normal play is untouched.
function applyDebugHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  if (!raw) return;
  // Idempotence guard. src/shot both assigns location.hash (which fires a
  // native hashchange) and dispatches a manual HashChangeEvent — so this ran
  // TWICE per shot. Harmless for map= and screen=, but talk= is STATEFUL and
  // double-advanced the quest chain: the render showed a quest at "done" with
  // the giver's ordinary dialogue on screen. One hash, one application.
  if (game._lastHash === raw) return;
  game._lastHash = raw;
  const opts = {};
  raw.split(/[&,]/).forEach(pair => {
    const [k, v] = pair.split(/[=:]/);
    if (k) opts[k.trim()] = (v || "").trim();
  });
  // fresh=1 wipes the play save first. Snapshots would otherwise inherit
  // whatever the last run left in localStorage, which quietly makes "the same
  // shot" mean something different every time.
  if (opts.fresh) {
    play.party = [];
    play.cages = CAGE_RESTOCK;
    play.pos = null;
    play.battlesWon = play.battlesLost = play.escapes = play.steps = 0;
    play.seen = {}; play.beaten = {}; play.caught = {};
    play.trainers = {}; play.badges = {}; play.box = [];
    play.visited = {}; play.quests = {}; play.legends = {};
    play.recruited = {};
    play.belly = 500;
    play.items = { cage: CAGE_RESTOCK, meat: 1 };
    // A fresh voyage also drops the manual slot — without this, a snapshot
    // test inherits whatever the previous run saved, silently.
    try { localStorage.removeItem(SLOT_KEY); } catch (e) {}
    ensureParty();
    // boot() has already restored the old saved position by the time this runs,
    // so clearing play.pos is not enough — the world has to be put back on the
    // ship as well, or a "new voyage" opens wherever the last one ended.
    loadMap("sunny", 4, 5, "down");
    game.fadeFrames = 0;
  }
  // party=sea_king:8 adds a fighter, so swap/party screens are testable.
  if (opts.party && SPECIES[opts.party]) {
    play.party.push(makeFighter(opts.party, opts.plvl ? +opts.plvl : 8));
    savePlay();
  }
  // lead=zoro puts that species at the FRONT of the party, so the back sprite
  // (the one you actually look at in battle) is snapshot-testable — party=
  // alone appends, and the starter stays the active fighter.
  if (opts.lead && SPECIES[opts.lead]) {
    play.party.unshift(makeFighter(opts.lead, opts.leadlvl ? +opts.leadlvl : 8));
    savePlay();
  }
  // badges=2 grants that many gym badges, so a badge-gated boss is reachable
  // in one shot. After fresh (which clears them), before any map is entered.
  if (opts.badges) {
    ["east_blue", "alabasta"].slice(0, +opts.badges).forEach(id => { play.badges[id] = true; });
    savePlay();
    applyWorldState();
  }
  const jumpsSomewhere = opts.map || opts.battle || opts.screen || opts.act ||
                         opts.talk || opts.text === "0";
  if (game.mode === MODE.TITLE && jumpsSomewhere && opts.title !== "1") dismissTitle();
  if (opts.title === "1") game.mode = MODE.TITLE;
  if (opts.text === "0") { game.mode = MODE.WORLD; game.text.pages = []; }
  if (opts.map && MAPS[opts.map]) {
    loadMap(opts.map, opts.x ? +opts.x : 4, opts.y ? +opts.y : 4, opts.dir || "down");
    game.fadeFrames = 0;
    game.mode = MODE.WORLD;
  }
  if (opts.battle) {
    startBattle();
    // foe=sea_king pins the encounter, so a given sprite is snapshot-testable
    // instead of waiting for the random pool to roll it.
    if (opts.foe && SPECIES[opts.foe]) {
      const lvl = game.battle.foe.lvl;
      game.battle.foe = makeFighter(opts.foe, lvl);
      game.battle.speciesId = opts.foe;
      game.battle.foeHpShown = game.battle.foe.hp;
    }
    if (opts.battle === "menu") game.battle.phase = "menu";
    if (opts.battle === "moves") { game.battle.phase = "moves"; game.battle.moveIdx = 0; }
    if (opts.battle === "swap") { game.battle.phase = "swap"; game.battle.swapIdx = 0; }
    // Drain the entry wipe: battleTick() returns early while it runs, so a
    // press= sequence would otherwise pile its keys up unconsumed and fire all
    // at once when the wipe ends (measured: right-a-down-down-a became RUN).
    game.battle.entry = 0;
  }
  // status=PSN afflicts the active fighter (in or out of battle — the battle
  // hero IS the party fighter, same live reference); foestatus=SLP afflicts the
  // pinned foe. Both make ailment rendering and chip damage snapshot-testable
  // without waiting on a chance roll.
  if (opts.status) {
    ensureParty();
    applyStatus(activeFighter(), opts.status.toUpperCase());
    savePlay();
  }
  if (opts.foestatus && game.battle) {
    applyStatus(game.battle.foe, opts.foestatus.toUpperCase());
  }
  // item=herb,n=3 drops items in the bag, so cure/sell paths are testable.
  if (opts.item && ITEMS[opts.item]) giveItem(opts.item, opts.n ? +opts.n : 1);
  // talk=1 fires the interact the player would fire standing where they stand,
  // so NPC dialogue is snapshot-testable without simulating a keypress.
  if (opts.talk) tryInteract();
  // step=1 runs the same end-of-step checks a real move would, so line-of-sight
  // is snapshot-testable from a standing position.
  if (opts.step) onStepComplete();
  // act=fight|cage|run drives the real battle path (same functions the menu
  // calls), so an exchange can be verified end-to-end in one shot instead of
  // being reasoned about.
  if (opts.act) {
    // auto also flushes overworld dialogue, so a trainer fight (which starts
    // from a talk callback) can be driven end to end in one shot.
    if (opts.act === "auto") {
      for (let i = 0; i < 80 && game.mode === MODE.TEXT; i++) advanceText();
    }
    if (opts.act === "fight" && game.battle) heroAttack(opts.move ? +opts.move : 0);
    else if (opts.act === "cage" && game.battle) tryCatch();
    else if (opts.act === "run" && game.battle) tryRun();
    else if (opts.act === "auto") {
      // Play a whole battle through the real functions — attack, advance text,
      // repeat — so the win path (XP grant, level-up, move learning, stat
      // recompute) is exercised for real rather than argued about. Capped
      // because an out-of-PP fighter would otherwise loop forever.
      for (let i = 0; i < 900 && game.battle; i++) {
        const b = game.battle;
        if (b.phase === "text") battleAdvanceText();
        else if (b.phase === "menu") heroAttack(0);
        else break;
      }
      for (let i = 0; i < 80 && game.mode === MODE.TEXT; i++) advanceText();
    }
  }
  // press=right-a-down-a runs one tick per key with that key freshly pressed —
  // the same consumption path a real keydown takes (took() clears it), so
  // menu/shop/bag/dialogue input is drivable end-to-end in a shot.
  //
  // MUST run before the screen= block below: screen= assigns game.mode
  // directly, so applying it first silently overwrites whatever mode the
  // dialogue or menu was in and every queued key lands on the wrong screen.
  // That is exactly how a recruit flow "failed" while actually never running.
  if (opts.press) {
    for (const k of opts.press.split("-")) {
      pressed[k] = true;
      tick();
    }
  }
  // After act and press, so a screen can show the result in the same shot.
  if (opts.screen === "log") game.mode = MODE.LOG;
  if (opts.screen === "sheet") game.mode = MODE.SHEET;
  if (opts.screen === "menu") { game.menuIdx = 0; game.mode = MODE.MENU; }
  if (opts.screen === "party") { game.partyIdx = 0; game.mode = MODE.PARTY; }
  if (opts.screen === "bag") { game.bagIdx = 0; game.mode = MODE.BAG; }
  if (opts.screen === "travel") game.mode = MODE.TRAVEL;
  if (opts.screen === "shop") {
    game.shopIdx = 0;
    game.shopTab = opts.tab === "sell" ? 1 : 0;
    game.mode = MODE.SHOP;
  }
  if (opts.evo && SPECIES[opts.evo]) {
    ensureParty();
    const f = play.party[0];
    f.id = opts.evo;
    (game.pendingEvos = game.pendingEvos || []).push({ f: f, to: SPECIES[opts.evo].evolvesTo });
    openNextEvo();
    if (opts.evot) for (let i = 0; i < +opts.evot; i++) game.evo.t++;
  }
  if (opts.logpage) game.logPage = +opts.logpage;
  if (opts.dbg) game.dbg = true;
  if (opts.sel) game.travelIdx = +opts.sel;
  // page=n advances battle text n pages, so a line queued after the first page
  // (a chip-damage or ailment line) is reachable in one deterministic shot.
  if (opts.page && game.battle) {
    for (let i = 0; i < +opts.page; i++) {
      const t = game.battle.text;
      if (t) t.chars = 9999;
      battleAdvanceText();
    }
  }
  const ticks = opts.ticks ? +opts.ticks : 0;
  for (let i = 0; i < ticks; i++) tick();
}

function boot() {
  loadPlay();
  buildBlocks();
  buildSprites();
  populateNpcs();
  ensureParty();
  resize();
  // Resume where the save left off; fall back to the ship on a fresh start or a
  // save that points at a map that no longer exists.
  const saved = play.pos;
  const resuming = saved && MAPS[saved.map];
  if (resuming) loadMap(saved.map, saved.x, saved.y, saved.dir || "down");
  else loadMap("sunny", 4, 5, "down");
  game.fadeFrames = 0;
  const opening = resuming
    ? ["BACK ON THE VOYAGE."]
    : ["THE THOUSAND SUNNY IS DOCKED AT SHELLS TOWN."];
  const lead = play.party[0];
  if (lead) opening.push(nameOf(lead) + " IS AT YOUR SIDE. LEVEL " + lead.lvl + ".");
  if (!GD) {
    opening.push("NO CREW LOG LOADED - THE CREW'S OWN NUMBERS ARE BLANK.");
  } else if (ROUTE && ROUTE.at_island) {
    opening.push("CREW XP " + commas(ROUTE.total_crew_xp) + ". FURTHEST PORT: " +
                 ROUTE.at_island.toUpperCase() + ".");
  }
  say(opening);
  game.mode = MODE.TITLE;
  // src/shot assigns location.hash AFTER the page has loaded and fires
  // hashchange, so reading the hash once in boot() would always miss it.
  window.addEventListener("hashchange", () => { applyDebugHash(); render(); });
  applyDebugHash();
  // Paint frame 1 synchronously. Without this the window shows nothing until the
  // first timer fires, which off-screen may be never.
  render();
  setInterval(loop, FRAME_MS);
}

boot();
</script>

<script>
// ---------------------------------------------------------- touch input
// Writes into the SAME `held` / `pressed` maps the keyboard writes into, so
// every consumer (took(), clearPressed(), the world tick) is untouched and a
// tap is literally indistinguishable from a keypress downstream.
(function () {
  "use strict";
  const coarse = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  // Read by the title screen, which otherwise tells a phone to press a key it
  // does not have. Set before the early return so desktop reads a real false.
  window.__touchUI = coarse;
  if (!coarse) return;

  const DIRS = ["up", "down", "left", "right"];
  const arms = {};
  DIRS.forEach(d => { arms[d] = document.getElementById("tc-" + d); });

  function press(k) {
    userGestured = true;          // unlocks audio, same as the keyboard path
    if (!held[k]) pressed[k] = true;
    held[k] = true;
  }
  function release(k) { held[k] = false; }

  function setDir(dir) {
    DIRS.forEach(d => {
      if (d === dir) press(d); else release(d);
      arms[d].classList.toggle("on", d === dir);
    });
  }

  // ---- d-pad: direction from the angle to the pad's centre, not from which
  // child element was hit. A thumb drifting off the arm keeps walking.
  const pad = document.getElementById("tc-pad");
  let padId = null;

  function applyPad(e) {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    // Dead zone: a thumb resting dead centre should stand still, not jitter.
    if (Math.hypot(dx, dy) < r.width * 0.14) { setDir(null); return; }
    setDir(Math.abs(dx) > Math.abs(dy)
      ? (dx > 0 ? "right" : "left")
      : (dy > 0 ? "down" : "up"));
  }

  pad.addEventListener("pointerdown", e => {
    padId = e.pointerId;
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    applyPad(e);
    e.preventDefault();
  });
  pad.addEventListener("pointermove", e => {
    if (e.pointerId === padId) { applyPad(e); e.preventDefault(); }
  });
  function endPad(e) {
    if (e.pointerId !== padId) return;
    padId = null;
    setDir(null);
  }
  pad.addEventListener("pointerup", endPad);
  pad.addEventListener("pointercancel", endPad);

  // ---- A / B / mute
  function wireButton(el, key) {
    el.addEventListener("pointerdown", e => {
      press(key);
      el.classList.add("on");
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    const up = e => { release(key); el.classList.remove("on"); };
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  }
  wireButton(document.getElementById("tc-a"), "a");
  wireButton(document.getElementById("tc-b"), "b");
  wireButton(document.getElementById("tc-mute"), "mute");

  // A pointer lost anywhere (call, notification, app switch) must not leave a
  // direction stuck down — that walks the player into a wall forever.
  window.addEventListener("blur", () => { setDir(null); release("a"); release("b"); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { setDir(null); release("a"); release("b"); }
  });

  // ------------------------------------------------------------- the fit
  // The original resize() picks an integer scale in CSS pixels. On a 390pt
  // phone that is 2 (320px wide) and leaves the screen small in the middle of
  // nowhere. Integer scaling matters in DEVICE pixels, not CSS ones — at DPR 3
  // there are 1170 real pixels to work with, so scale 7 fits and each game
  // pixel is exactly 7 physical pixels. Sharp AND nearly full width.
  //
  // Runs after the original handler (registered later), so it wins the resize.
  function fit() {
    const vv = window.visualViewport;
    const vw = vv ? vv.width : window.innerWidth;
    const vh = vv ? vv.height : window.innerHeight;
    const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
    const tc = document.getElementById("tc");
    const controls = tc.getBoundingClientRect().height + 28;
    const availW = vw - 8;
    const availH = vh - controls - 24;
    const s = Math.max(1, Math.min(
      Math.floor(availW * dpr / W),
      Math.floor(availH * dpr / H)));
    screen.width = W * s;
    screen.height = H * s;
    screen.style.width = (W * s / dpr) + "px";
    screen.style.height = (H * s / dpr) + "px";
    sctx.imageSmoothingEnabled = false;
    // Setting canvas.width clears it — same trap the original resize() calls
    // out. Repaint in the same turn or the phone shows a blank screen.
    if (game.map) render();
  }

  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 120));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  window.addEventListener("load", () => setTimeout(fit, 0));
  setTimeout(fit, 0);

  // Double-tap zoom and rubber-band scroll both make a fixed-canvas game feel
  // broken. touch-action handles most of it; this closes the gesture path.
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());
})();

// Offline. Without this, a home-screen icon that needs signal is a bookmark,
// not a game. Registration is guarded: service workers only exist in a secure
// context, so this is a no-op over plain http on the LAN and real on Pages.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
